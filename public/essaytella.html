<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESSAYTELLA — 에쎄이텔라</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;900&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c1a17; --paper:#f0ebe1; --card:#faf7f0;
    --accent:#7a5c3e; --accent-soft:#c9a678;
    --line:#d2c6b2; --muted:#8a7f6e;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 10% -5%, rgba(201,166,120,0.15), transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Serif KR','Noto Serif JP','Noto Serif CJK KR',Georgia,serif;
    min-height:100vh;
  }
  .frame{max-width:780px;margin:0 auto;padding:34px 22px 90px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px;}
  .wordmark{display:flex;align-items:center;gap:12px;}
  .wordmark svg{display:block;}
  .wordmark .wm{font-family:Georgia,serif;font-size:18px;font-weight:700;letter-spacing:0.2em;}
  .langs{display:flex;gap:6px;}
  .lang-btn{
    padding:6px 12px;background:transparent;border:1px solid var(--line);border-radius:16px;
    font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--muted);cursor:pointer;
  }
  .lang-btn.on{background:var(--ink);border-color:var(--ink);color:var(--paper);}
  .tabbar{display:flex;gap:8px;margin-bottom:34px;border-bottom:1px solid var(--line);}
  .tab{
    padding:12px 18px;background:transparent;border:none;cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;font-size:14.5px;font-weight:700;color:var(--muted);
    border-bottom:3px solid transparent;margin-bottom:-1px;
  }
  .tab.on{color:var(--accent);border-bottom-color:var(--accent);}
  .pane{display:none;}
  .pane.on{display:block;}
  .eyebrow{
    font-family:'Noto Sans KR',sans-serif;font-size:12px;letter-spacing:0.3em;
    font-weight:700;color:var(--accent);margin-bottom:18px;
  }
  h1{font-size:34px;line-height:1.36;font-weight:900;letter-spacing:-0.01em;}
  h1 .u{color:var(--accent);box-shadow:inset 0 -10px 0 rgba(201,166,120,0.4);}
  .manifesto{margin-top:20px;padding-left:22px;border-left:3px solid var(--accent-soft);}
  .manifesto p{font-size:16px;line-height:1.95;font-weight:500;color:#3d372f;}
  .manifesto .close{margin-top:8px;font-family:'Noto Sans KR',sans-serif;font-size:13px;color:var(--muted);}
  .card{
    background:var(--card);border:1px solid #ddd3c2;border-radius:5px;
    padding:24px 22px;margin-top:20px;
  }
  .card-label{
    font-family:'Noto Sans KR',sans-serif;font-size:12px;letter-spacing:0.18em;
    color:var(--accent);font-weight:700;display:block;margin-bottom:16px;
  }
  .card-label .opt{color:var(--muted);letter-spacing:0;font-weight:500;}
  input[type=text],input[type=password],textarea{
    width:100%;padding:12px 14px;font-size:15px;
    font-family:'Noto Sans KR',sans-serif;border:1px solid #cabfad;border-radius:4px;
    background:#fff;outline:none;color:var(--ink);
  }
  textarea{resize:vertical;line-height:1.7;font-family:'Noto Serif KR','Noto Serif JP',serif;font-size:15.5px;}
  input:focus,textarea:focus{border-color:var(--accent-soft);}
  .type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px;}
  @media (max-width:560px){.type-grid{grid-template-columns:repeat(2,1fr);}}
  .type-btn{
    padding:13px 10px;background:#fff;border:1px solid var(--line);border-radius:4px;
    cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;
    font-family:'Noto Sans KR',sans-serif;transition:all .15s;
  }
  .type-btn:hover{border-color:var(--accent-soft);}
  .type-btn.on{background:var(--accent);border-color:var(--accent);}
  .type-btn.on .t-main,.type-btn.on .t-hint{color:#fff;}
  .t-main{font-size:14px;font-weight:700;color:var(--ink);}
  .t-hint{font-size:11px;color:var(--muted);}
  .kw-row{display:flex;gap:10px;}
  .kw-row input{flex:1;}
  .add-btn{
    padding:0 20px;background:var(--ink);color:var(--paper);border:none;border-radius:4px;
    font-size:14px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;font-weight:600;
  }
  .chosen{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .chosen-chip{
    background:var(--accent);color:#fff;padding:7px 14px;border-radius:20px;font-size:13.5px;
    font-family:'Noto Sans KR',sans-serif;cursor:pointer;font-weight:500;border:none;
  }
  .chosen-chip span{opacity:0.7;margin-left:4px;}
  .helper-toggle{
    margin-top:16px;background:transparent;border:none;color:var(--muted);
    font-family:'Noto Sans KR',sans-serif;font-size:13px;cursor:pointer;padding:0;
    text-decoration:underline;text-underline-offset:3px;
  }
  .helper{display:none;margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;}
  .helper.show{display:block;}
  .helper p{
    font-family:'Noto Sans KR',sans-serif;font-size:13.5px;color:#6b6254;
    line-height:1.7;padding:5px 0;
  }
  .helper p b{color:var(--accent);font-weight:700;}
  .hint{
    font-family:'Noto Sans KR',sans-serif;font-size:12.5px;color:var(--muted);
    margin-top:10px;line-height:1.6;
  }
  .sub-label{
    font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--muted);
    font-weight:700;margin:18px 0 10px;letter-spacing:0.08em;
  }
  .sub-label.first{margin-top:0;}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{
    padding:9px 16px;background:#fff;border:1px solid var(--line);border-radius:22px;
    font-family:'Noto Sans KR',sans-serif;font-size:13.5px;color:#5c554b;cursor:pointer;
    transition:all .15s;
  }
  .chip b{color:var(--accent);}
  .chip:hover{border-color:var(--accent-soft);}
  .chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper);}
  .chip.on b{color:var(--accent-soft);}
  .chip .dot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--accent-soft);margin-left:6px;vertical-align:middle;
  }
  .gen-btn{
    width:100%;padding:16px;background:var(--accent);color:#fff;border:none;border-radius:5px;
    font-size:16.5px;font-family:'Noto Serif KR','Noto Serif JP',serif;font-weight:700;cursor:pointer;
    letter-spacing:0.04em;margin-top:22px;transition:background .15s;
  }
  .gen-btn:hover{background:#6a4e33;}
  .gen-btn:disabled{opacity:0.6;cursor:default;}
  .loading-line{
    font-family:'Noto Sans KR',sans-serif;font-size:13.5px;color:var(--accent);
    text-align:center;margin-top:16px;display:none;
  }
  .loading-line.show{display:block;}
  .error{
    margin-top:14px;color:#a1442f;font-family:'Noto Sans KR',sans-serif;
    font-size:14px;text-align:center;line-height:1.6;
  }
  .keybox{display:none;margin-top:16px;}
  .keybox.show{display:block;}
  .result{margin-top:28px;display:none;}
  .result.show{display:block;}
  .style-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .regen-btn{
    padding:9px 18px;background:var(--accent);color:#fff;border:none;border-radius:22px;
    font-family:'Noto Sans KR',sans-serif;font-size:13.5px;font-weight:700;cursor:pointer;
  }
  .regen-btn:disabled{opacity:0.6;cursor:default;}
  .final{background:#fff;border:1px solid #ddd3c2;border-radius:5px;padding:28px 26px;}
  .final-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
  .final-label{
    font-family:'Noto Sans KR',sans-serif;font-size:12px;letter-spacing:0.18em;
    color:var(--accent);font-weight:700;
  }
  .char-count{font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--muted);}
  .final-text{font-size:16px;line-height:2;white-space:pre-wrap;-webkit-user-select:text;user-select:text;cursor:text;}
  .final-text .blank{
    background:rgba(201,166,120,0.25);border-bottom:2px solid var(--accent-soft);
    padding:0 6px;font-weight:700;color:var(--accent);
  }
  .dict-hint{margin-top:14px;font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--muted);}
  .act-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .act-btn{
    padding:10px 20px;background:transparent;border:1px solid var(--line);
    border-radius:4px;font-family:'Noto Sans KR',sans-serif;font-size:13px;color:#5c554b;
    cursor:pointer;
  }
  .act-btn:hover{border-color:var(--accent-soft);color:var(--accent);}
  .dict-pop{
    position:fixed;z-index:50;max-width:320px;
    background:var(--ink);color:var(--paper);border-radius:8px;
    padding:14px 16px;font-family:'Noto Sans KR',sans-serif;font-size:13.5px;line-height:1.7;
    box-shadow:0 8px 30px rgba(28,26,23,0.35);display:none;
  }
  .dict-pop.show{display:block;}
  .dict-pop .dw{color:var(--accent-soft);font-weight:700;margin-bottom:4px;font-size:14px;}
  .mode-desc{
    font-family:'Noto Sans KR',sans-serif;font-size:13.5px;color:#6b6254;line-height:1.7;
    margin-top:10px;
  }
  .tr-stage{margin-top:20px;}
  .compare{display:flex;flex-direction:column;gap:14px;margin-top:18px;}
  .cmp-box{background:#fff;border:1px solid #ddd3c2;border-radius:5px;padding:22px 22px;}
  .cmp-box.mine{border-left:4px solid var(--accent-soft);}
  .cmp-box.ai{border-left:4px solid var(--accent);}
  .cmp-label{
    font-family:'Noto Sans KR',sans-serif;font-size:11.5px;letter-spacing:0.16em;
    color:var(--accent);font-weight:700;margin-bottom:10px;
  }
  .cmp-text{font-size:15.5px;line-height:1.95;white-space:pre-wrap;}
  .obs-box{
    background:rgba(201,166,120,0.10);border:1px dashed var(--accent-soft);border-radius:5px;
    padding:20px 22px;margin-top:14px;
  }
  .obs-box .cmp-label{color:var(--muted);}
  .obs-box .cmp-text{font-family:'Noto Sans KR',sans-serif;font-size:14px;line-height:1.8;color:#4a4237;}
  .streak{
    font-family:'Noto Sans KR',sans-serif;font-size:12.5px;color:var(--muted);
    margin-top:8px;
  }
  .streak b{color:var(--accent);}
  .lib-title{
    font-family:'Noto Sans KR',sans-serif;font-size:12px;letter-spacing:0.24em;
    color:var(--muted);font-weight:700;margin-bottom:12px;
  }
  .lib-empty{
    font-family:'Noto Sans KR',sans-serif;font-size:13px;color:var(--muted);
    border:1px dashed var(--line);border-radius:5px;padding:18px;text-align:center;line-height:1.7;
  }
  .lib-item{
    background:var(--card);border:1px solid #ddd3c2;border-radius:5px;
    padding:14px 18px;margin-bottom:10px;cursor:pointer;
    display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  }
  .lib-item:hover{border-color:var(--accent-soft);}
  .lib-name{font-size:15px;font-weight:600;}
  .lib-meta{font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--muted);flex-shrink:0;}
  .lib-view{margin-top:18px;display:none;}
  .lib-view.show{display:block;}
  .set-block{margin-bottom:8px;}
  .about{
    font-family:'Noto Sans KR',sans-serif;font-size:13.5px;color:#6b6254;line-height:1.8;
  }
  footer{
    margin-top:60px;text-align:center;font-family:'Noto Sans KR',sans-serif;
    font-size:12.5px;color:#9a8f7e;line-height:1.7;
  }
  footer .fm{font-family:'Noto Serif KR','Noto Serif JP',serif;font-size:14px;color:var(--muted);}
</style>
</head>
<body>
<div class="frame">
  <div class="topbar">
    <div class="wordmark">
      <svg width="32" height="32" viewBox="0 0 34 34">
        <g stroke="#7a5c3e" stroke-width="1.1" fill="none">
          <line x1="6" y1="24" x2="14" y2="10"/><line x1="14" y1="10" x2="22" y2="17"/><line x1="22" y1="17" x2="29" y2="7"/><line x1="14" y1="10" x2="17" y2="27"/>
        </g>
        <g fill="#7a5c3e">
          <circle cx="6" cy="24" r="2.2"/><circle cx="14" cy="10" r="2.8"/><circle cx="22" cy="17" r="2.2"/><circle cx="29" cy="7" r="2.5"/><circle cx="17" cy="27" r="2"/>
        </g>
      </svg>
      <span class="wm">ESSAYTELLA</span>
    </div>
    <div class="langs" id="langRow"></div>
  </div>

  <div class="tabbar" id="tabbar"></div>

  <!-- ============ 탭 1: 엮기 ============ -->
  <div class="pane on" id="pane0">
    <div class="eyebrow" id="tEyebrow"></div>
    <h1 id="tTitle"></h1>
    <div class="manifesto">
      <p id="tManifesto"></p>
      <div class="close" id="tManifestoClose"></div>
    </div>

    <section class="card">
      <label class="card-label" id="tCard1"></label>
      <div class="type-grid" id="typeGrid"></div>
      <input type="text" id="title" placeholder="">
    </section>

    <section class="card">
      <label class="card-label"><span id="tCard2"></span> <span class="opt" id="tCard2Opt"></span></label>
      <div class="kw-row">
        <input type="text" id="kwInput" placeholder="">
        <button class="add-btn" id="tAddBtn" onclick="addKw()"></button>
      </div>
      <div class="chosen" id="chosen"></div>
      <button class="helper-toggle" id="tHelperToggle" onclick="toggleHelper()"></button>
      <div class="helper" id="helper"></div>
    </section>

    <section class="card">
      <label class="card-label" id="tCard3"></label>
      <div class="sub-label first" id="tSubPlatform"></div>
      <div class="chip-row" id="platformRow"></div>
    </section>

    <button class="gen-btn" id="genBtn" onclick="generate(null)"></button>
    <div class="loading-line" id="loadingLine"></div>
    <div class="error" id="errorBox"></div>

    <div class="result" id="result">
      <div class="sub-label" id="tSubStyle"></div>
      <div class="style-bar">
        <span id="styleTabs" style="display:contents;"></span>
        <button class="regen-btn" id="regenBtn" onclick="regen()"></button>
      </div>
      <div class="final">
        <div class="final-head">
          <div class="final-label" id="finalLabel"></div>
          <div class="char-count" id="charCount"></div>
        </div>
        <div class="final-text" id="finalText"></div>
        <div class="dict-hint" id="tDictHint"></div>
        <div class="act-row">
          <button class="act-btn" id="copyBtn" onclick="copyText()"></button>
          <button class="act-btn" id="saveBtn" onclick="saveToLibrary()"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 탭 2: 트레이닝 ============ -->
  <div class="pane" id="pane1">
    <div class="eyebrow" id="trEyebrow"></div>
    <h1 id="trTitleH"></h1>
    <div class="streak" id="trStreak"></div>

    <section class="card">
      <label class="card-label" id="trModeLabel"></label>
      <div class="chip-row" id="trModeRow"></div>
      <p class="mode-desc" id="trModeDesc"></p>
    </section>

    <section class="card">
      <label class="card-label" id="trWorkLabel"></label>
      <input type="text" id="trTitle" placeholder="">
      <input type="text" id="trKw" placeholder="" style="margin-top:10px;">
    </section>

    <div class="tr-stage" id="trStage"></div>
    <div class="loading-line" id="trLoading"></div>
    <div class="error" id="trError"></div>
  </div>

  <!-- ============ 탭 3: 서재 ============ -->
  <div class="pane" id="pane2">
    <div class="lib-title" id="tLibTitle"></div>
    <div id="libList"></div>
    <div class="lib-view" id="libView">
      <div class="final">
        <div class="final-head">
          <div class="final-label" id="libViewLabel"></div>
        </div>
        <div class="final-text" id="libViewText"></div>
        <div class="act-row">
          <button class="act-btn" id="libCopyBtn" onclick="libCopy()"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 탭 4: 설정 ============ -->
  <div class="pane" id="pane3">
    <section class="card set-block">
      <label class="card-label" id="setLangLabel"></label>
      <div class="chip-row" id="setLangRow"></div>
    </section>
    <section class="card set-block">
      <label class="card-label" id="setKeyLabel"></label>
      <input type="password" id="apiKey" placeholder="sk-ant-…">
      <p class="hint" id="setKeyHint"></p>
    </section>
    <section class="card set-block">
      <label class="card-label" id="setAboutLabel"></label>
      <p class="about" id="setAboutText"></p>
    </section>
  </div>

  <div class="keybox" id="keyBox">
    <div class="card">
      <label class="card-label" id="tKeyLabel"></label>
      <p class="hint" id="tKeyHint"></p>
    </div>
  </div>

  <footer>
    <div class="fm" id="tMotto"></div>
    <div style="margin-top:6px;letter-spacing:0.2em;">ESSAYTELLA</div>
  </footer>
</div>

<div class="dict-pop" id="dictPop"></div>

<script>
/* ============ i18n ============ */
const I18N = {
  ko: {
    langLabel:"한국어", outputLang:"한국어",
    tabs:["엮기","트레이닝","서재","설정"],
    eyebrow:"감상문 쓰기 트레이닝",
    title:'어렴풋한 단어 몇 개가,<br><span class="u">평론의 문장</span>이 됩니다.',
    manifesto:"방대한 지식을 쌓고 싶지만, 늘 정리가 안 된다.<br>읽고 본 것은 많은데, 문장 앞에서 흩어진다.<br>아는 한도 안에서, 조금 더 잘 엮고 싶다.",
    manifestoClose:"— 이 마음 하나에서 시작한 앱입니다.",

    types:[
      {label:"책 · 글", value:"책", hint:"소설·시·에세이·논픽션"},

      {label:"미술 · 전시", value:"미술", hint:"그림·조각·전시·사진"},
      {label:"음악 · 공연", value:"음악", hint:"곡·앨범·콘서트·연주"},
      {label:"음식 · 미각", value:"음식", hint:"요리·식당·차·술"},
      {label:"그 밖의 체험", value:"체험", hint:"여행·장소·사람·순간"}
    ],
    titlePh:"작품·대상의 이름 — 예: 데미안, 퍼펙트 데이즈, 이중섭 전시",
    card2:"02  떠오른 키워드", card2Opt:"— 하나면 충분합니다",
    kwPh:"예: 에반게리온 …  엔터로 추가", addBtn:"추가",

    helperQs:["보고 나서 가장 오래 남은 장면·문장·소리는?","보는 동안 떠오른 다른 작품, 사람, 기억은?","어딘가 불편하거나 걸렸던 지점은?","한 단어로 줄인다면? (감정이어도, 개념이어도)"],
    helperHint:"답이 떠오르면 그 단어를 그대로 키워드로 넣으세요. 문장일 필요 없습니다.",
    card3:"03  용도 · 분량", subPlatform:"용도 · 분량", subStyle:"문체 — 골라서 다시 보기",
    platforms:[
      {label:"논술 · 서평", desc:"1,600자", spec:"1600자 내외 (한글 기준, ±15%)"},
      {label:"블로그", desc:"1,000자", spec:"1000자 내외 (한글 기준, ±15%)"},
      {label:"인스타", desc:"300자", spec:"300자 내외"},
      {label:"쓰레드", desc:"500자", spec:"500자 내외"},
      {label:"X", desc:"280자", spec:"280자 이내"}

let lang="ko", curTab=0, selPlatform=1, selType="", keywords=[], cache={}, activeStyle=0, library=[], hasResult=false;
let trMode=0, trPhase=0, trData={}, trainCount=0;
const $=(id)=>document.getElementById(id);
const T=()=>I18N[lang];

/* ---- 언어 스위처 (상단 + 설정) ---- */
function buildLangRows(){
  ["langRow","setLangRow"].forEach(rowId=>{
    const row=$(rowId); row.innerHTML="";
    Object.keys(I18N).forEach(code=>{
      const b=document.createElement("button");
      b.className=(rowId==="langRow"?"lang-btn":"chip")+(code===lang?" on":"");
      b.textContent=I18N[code].langLabel;
      b.onclick=()=>{lang=code;cache={};hasResult=false;$("result").classList.remove("show");resetTrain();applyLang();};
      row.appendChild(b);
    });
  });
}

/* ---- 탭 ---- */
function buildTabs(){
  const bar=$("tabbar"); bar.innerHTML="";
  T().tabs.forEach((label,i)=>{
    const b=document.createElement("button");
    b.className="tab"+(i===curTab?" on":"");
    b.textContent=label;
    b.onclick=()=>{curTab=i;
      [...bar.children].forEach((x,j)=>x.classList.toggle("on",j===i));
      for(let j=0;j<4;j++)$("pane"+j).classList.toggle("on",j===i);
    };
    bar.appendChild(b);
  });
}

function applyLang(){
  const t=T();
  buildLangRows(); buildTabs();
  $("tEyebrow").textContent=t.eyebrow;
  $("tTitle").innerHTML=t.title;
  $("tManifesto").innerHTML=t.manifesto;
  $("tManifestoClose").textContent=t.manifestoClose;
  $("tCard1").textContent=t.card1;
  $("title").placeholder=t.titlePh;
  $("tCard2").textContent=t.card2;

function wordAtPoint(x,y){
  let range=null;
  if(document.caretRangeFromPoint){range=document.caretRangeFromPoint(x,y);}
  else if(document.caretPositionFromPoint){
    const pos=document.caretPositionFromPoint(x,y);
    if(pos){range=document.createRange();range.setStart(pos.offsetNode,pos.offset);}
  }
  if(!range||range.startContainer.nodeType!==3)return null;
  const txt=range.startContainer.textContent, i=range.startOffset;
  const isW=(ch)=>/[\p{L}\p{N}·]/u.test(ch);
  if(i>=txt.length||!isW(txt[i]||""))return null;
  let s=i,e=i;
  while(s>0&&isW(txt[s-1]))s--;
  while(e<txt.length&&isW(txt[e]))e++;
  return txt.slice(s,e);
}

async function lookupWordAt(x,y){
  const t=T(), word=wordAtPoint(x,y);
  if(!word||word.length<2)return;
  const pop=$("dictPop");
  pop.innerHTML=`<div class="dw">${esc(word)}</div>${t.dictLoading}`;
  pop.style.left=Math.min(x,window.innerWidth-340)+"px";
  pop.style.top=(y+18)+"px";
  pop.classList.add("show");
  try{
    const text=await ai(`단어 "${word}"를 ${t.outputLang}로 두세 문장으로 쉽게 설명하라. 정의만, 다른 말 없이.`,300);
    pop.innerHTML=`<div class="dw">${esc(word)}</div>${esc(text)}`;
  }catch(e){
    pop.innerHTML=`<div class="dw">${esc(word)}</div>${t.dictFail}`;
  }
}

/* ---- 복사·서재 ---- */
function copyText(){
  const t=T();
  navigator.clipboard.writeText($("finalText").textContent).then(()=>{
    $("copyBtn").textContent=t.copied;
    setTimeout(()=>$("copyBtn").textContent=t.copyBtn,1500);
  });
}
function saveToLibrary(){
  const t=T();
  if(!hasResult)return;
  const title=$("title").value.trim()||t.untitled;
  library.unshift({
    title, keywords:[...keywords],
    style:t.styles[activeStyle].key,
    platform:t.platforms[selPlatform].label,
    text:$("finalText").textContent
  });
  renderLibrary();
  $("saveBtn").textContent=t.saved;
  setTimeout(()=>$("saveBtn").textContent=t.saveBtn,1500);
}
function renderLibrary(){
  const t=T(), list=$("libList");
  list.innerHTML="";
  if(library.length===0){
    list.innerHTML=`<div class="lib-empty">${t.libEmpty}</div>`;
    $("libView").classList.remove("show");
    return;
  }
  library.forEach((item)=>{
    const d=document.createElement("div");
    d.className="lib-item";
    d.innerHTML=`<span class="lib-name">${esc(item.title)}</span><span class="lib-meta">${esc(item.style)} · ${esc(item.platform)}</span>`;
    d.onclick=()=>{
      $("libViewLabel").textContent=`${item.title} · ${item.style} · ${item.platform}`;
      $("libViewText").textContent=item.text;
      $("libView").classList.add("show");
      $("libView").scrollIntoView({behavior:"smooth",block:"nearest"});
    };
    list.appendChild(d);
  });
}
function libCopy(){
  const t=T();
  navigator.clipboard.writeText($("libViewText").textContent).then(()=>{
    $("libCopyBtn").textContent=t.copied;
    setTimeout(()=>$("libCopyBtn").textContent=t.copyBtn,1500);
  });
}

applyLang();
</script>
