async function makeShareBlob(){
 const record=currentShareRecord||myRecord||sharedWish;
 const name=record?.name||'';
 const key=String(record?.id||'guest')+':'+name;
 if(shareBlob&&shareBlobFor===key)return shareBlob;
 if(sharePromise&&shareBlobFor===key)return sharePromise;
 shareBlobFor=key;
 const picture=drawCardToCanvas(name);
 if(!picture)throw new Error('Canvas unavailable');
 const blobPromise=new Promise((resolve,reject)=>{
  if(typeof picture.toBlob==='function'){
   picture.toBlob(blob=>blob?resolve(blob):reject(new Error('PNG conversion failed')),'image/png');
  }else{
   try{
    const url=picture.toDataURL('image/png');
    const binary=atob(url.split(',')[1]),bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    resolve(new Blob([bytes],{type:'image/png'}));
   }catch(e){reject(e)}
  }
 });
 sharePromise=blobPromise;
 try{
  const blob=await blobPromise;
  if(shareBlobFor===key)shareBlob=blob;
  return blob;
 }finally{if(sharePromise===blobPromise)sharePromise=null}
}
function setSharingRecord(record){
 currentShareRecord=record||null;
 shareBlob=null;shareBlobFor='';sharePromise=null;
 if(record){saveCardButton.hidden=false;document.getElementById('recordReelBtn').hidden=false;}
}

  const prepare=()=>makeShareBlob().catch(()=>{});
  if(typeof requestIdleCallback==='function')requestIdleCallback(prepare,{timeout:1600});
  else setTimeout(prepare,200);
 },5300);
}

/* Export the real celebration to a 9:16 video for Instagram Stories/Reels.
 * Drawing source canvases is necessary because MediaRecorder cannot record
 * the CSS name animation. Add our own typographic animation into video pixels.
 * Video is silent: add any licensed music inside Instagram.
 * Codec is feature-detected: Safari often supports H.264 MP4, others WebM.
 */
const recordReelButton=document.getElementById('recordReelBtn');
const reelModal=document.getElementById('reelModal');
const reelVideo=document.getElementById('reelPreview');
const reelStatus=document.getElementById('reelStatus');
const downloadReelButton=document.getElementById('downloadReelBtn');

if(myRecord||sharedWish)recordReelButton.hidden=false;
function reelMimeType(){
 if(typeof MediaRecorder==='undefined'||typeof MediaRecorder.isTypeSupported!=='function')return '';
 const types=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp8','video/webm'];
 return types.find(type=>MediaRecorder.isTypeSupported(type))||'';
}
function drawReelFrame(g,videoWidth,videoHeight,name,elapsed){
 const w=videoWidth,h=videoHeight,p=Math.min(1,Math.max(0,elapsed/reelDurationMs));
 // Paint a dark live background, then capture both independent animation layers.
 const sky=g.createLinearGradient(0,0,0,h);
 sky.addColorStop(0,'#020c17');sky.addColorStop(.5,'#0b2a25');sky.addColorStop(1,'#07121c');
 g.globalAlpha=1;g.fillStyle=sky;g.fillRect(0,0,w,h);
 const scale=Math.max(w/Math.max(1,W),h/Math.max(1,H));
 const dw=W*scale,dh=H*scale,dx=(w-dw)/2,dy=(h-dh)/2;
 g.drawImage(fireworkCanvas,0,0,fireworkCanvas.width,fireworkCanvas.height,dx,dy,dw,dh);
 g.drawImage(canvas,0,0,canvas.width,canvas.height,dx,dy,dw,dh);
 // Subtle gradient frame so the user's name stays legible over fireworks.
 const vignette=g.createLinearGradient(0,0,0,h);
 vignette.addColorStop(0,'rgba(1,6,15,.86)');
 vignette.addColorStop(.19,'rgba(1,8,16,.11)');
 vignette.addColorStop(.62,'rgba(1,8,16,.12)');
 vignette.addColorStop(1,'rgba(1,8,16,.91)');
 g.globalAlpha=1;g.fillStyle=vignette;g.fillRect(0,0,w,h);
 g.textAlign='center';g.textBaseline='middle';
 g.fillStyle='#f5db9d';g.font=`600 ${Math.round(w*.032)}px system-ui,-apple-system,sans-serif`;
 g.fillText('✦  MERRY CHRISTMAS  ✦',w/2,h*.085);
 // Start recording with the name SMALL on frame zero. Expand to full
 // size over 0.95 seconds, overshoot gently, then a bright burst at 1.05s.
 // This is drawn directly into the encoded video, not an unrecorded CSS overlay.
 const age=elapsed/1000;
 const growth=Math.min(1,Math.max(0,age/.95));
 const easing=1-Math.pow(1-growth,3);
 const pop=1+(.10*Math.sin(Math.PI*Math.min(1,Math.max(0,(age-.84)/.35))));
 const nameScale=(.13+.87*easing)*pop;
 const outro=Math.min(1,Math.max(0,(5.0-age)/.9));
 const alpha=(.67+.33*easing)*outro;
 if(alpha>0){
  const label=name.endsWith('님')?name:name+'님';
  let fontSize=Math.round(w*.095);
  g.font=`800 ${fontSize}px system-ui,-apple-system,sans-serif`;
  while(fontSize>26&&g.measureText(label).width>w*.9){fontSize-=3;g.font=`800 ${fontSize}px system-ui,-apple-system,sans-serif`}
  const nameY=h*.43;
  g.save();g.translate(w/2,nameY);g.scale(nameScale,nameScale);
  g.globalAlpha=alpha;
  g.shadowColor='#ffda87';g.shadowBlur=w*.055;
  g.fillStyle='#fff4ce';g.fillText(label,0,0);
  g.shadowBlur=w*.025;
  g.font=`750 ${Math.round(w*.055)}px system-ui,-apple-system,sans-serif`;
  g.fillStyle='#d4fff0';g.fillText('메리 크리스마스!',0,h*.065);
  g.restore();
  // The starburst follows the growth, so the opening small-name moment
  // is visible in the saved video BEFORE the fireworks explode.
  const burst=Math.min(1,Math.max(0,(age-.95)/1.25));
  if(burst>0&&burst<1){
   g.save();
   for(let i=0;i<40;i++){
    const theta=i*Math.PI/20+.21;
    const radius=burst*w*.34;
    g.globalAlpha=outro*Math.pow(1-burst,1.5)*.92;
    g.fillStyle=i%3===0?'#e8fff7':'#ffeab3';
    g.fillRect(w/2+Math.cos(theta)*radius-1.4,nameY+Math.sin(theta)*radius-1.4,3.2,3.2);
   }
   g.restore();
  }
 }
 g.fillStyle='#fff0c6';g.font=`700 ${Math.round(w*.045)}px system-ui,-apple-system,sans-serif`;
 g.fillText('골프채공작소',w/2,h*.91);
 g.fillStyle='#d4ded9';g.font=`500 ${Math.round(w*.022)}px system-ui,-apple-system,sans-serif`;
 g.fillText('CLUBMAKERS  ·  CHRISTMAS 2026',w/2,h*.94);
 if(p>.84){
  g.globalAlpha=Math.min(1,(p-.84)/.12);
  g.font=`600 ${Math.round(w*.028)}px system-ui,-apple-system,sans-serif`;
  g.fillStyle='#fce8b9';g.fillText('함께 꾸미는 크리스마스트리',w/2,h*.83);
  g.globalAlpha=1;
 }
}
function showReelPreview(blob,name,mime){
 if(reelObjectURL)URL.revokeObjectURL(reelObjectURL);
 reelObjectURL=URL.createObjectURL(blob);
 currentReel={blob,mime,name};
 reelVideo.src=reelObjectURL;
 reelVideo.muted=true;
 reelVideo.load();
 const mp4=mime.includes('mp4');
 reelStatus.textContent=mp4?'MP4 영상 완성 · 영상 저장 또는 인스타그램으로 공유하세요':
   'WebM 영상 완성 · 인스타그램 업로드에는 MP4 변환이 필요할 수 있습니다';
 reelModal.hidden=false;downloadReelButton.disabled=false;shareReelButton.disabled=false;
}
function getVideoFile(){
 if(!currentReel)throw new Error('No recorded reel');
 const mp4=currentReel.mime.includes('mp4');
 const ext=mp4?'mp4':'webm';
 const fileName='clubmakers-'+cleanCardFileName(currentReel.name)+'-christmas-reel.'+ext;
 return {fileName,blob:currentReel.blob,mime:currentReel.mime,mp4};

async function recordChristmasReel(){
 const record=currentShareRecord||myRecord||sharedWish;
 if(reelBusy||!record?.name)return;
 if(typeof MediaRecorder==='undefined'||typeof HTMLCanvasElement==='undefined'||typeof HTMLCanvasElement.prototype.captureStream!=='function'){
  notify('이 브라우저는 영상 저장을 지원하지 않습니다. Safari에서 다시 열어주세요.');
  return;
 }
 const mime=reelMimeType();
 if(!mime){notify('영상 인코딩을 지원하지 않습니다. Safari에서 열어주세요.');return}
 const name=String(record.name).slice(0,12);
 reelBusy=true;recordReelButton.disabled=true;recordReelButton.textContent='● 영상 제작 중…';
 const duration=reelDurationMs;
 let offscreen=null,stream=null,recorder=null,frameId=0,guard=null;
 try{
  if(reelObjectURL){URL.revokeObjectURL(reelObjectURL);reelObjectURL=null}
  currentReel=null;reelVideo.removeAttribute('src');reelVideo.load();
  offscreen=document.createElement('canvas');
  const mobile=W<700;
  offscreen.width=mobile&&lowPowerMode?540:720;
  offscreen.height=Math.round(offscreen.width*16/9);
  offscreen.style.cssText='position:fixed;left:-9999px;top:0;width:1px;height:1px;pointer-events:none';
  document.body.appendChild(offscreen);
  const context=offscreen.getContext('2d',{alpha:false});
  if(!context)throw new Error('2D canvas unavailable');
  // Restart a real on-screen celebration so the exact same rockets are recorded.
  artRoot.classList.add('reel-recording');
  showChristmasArt(name);
  const lastFrameStep=1000/(mobile?20:24);
  let startedAt=0,lastVideoFrame=-1000,completed=false;
  drawReelFrame(context,offscreen.width,offscreen.height,name,0);
  stream=offscreen.captureStream(mobile?20:24);
  recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:mobile?2100000:3400000});
  const chunks=[];
  const recorded=new Promise((resolve,reject)=>{
   recorder.ondataavailable=ev=>{if(ev.data?.size)chunks.push(ev.data)};
   recorder.onerror=ev=>reject(ev.error||new Error('MediaRecorder error'));
   recorder.onstop=()=>{
    const actualMime=recorder.mimeType||mime;
    const output=new Blob(chunks,{type:actualMime});
    if(output.size<700)reject(new Error('Empty recording'));
    else resolve({blob:output,mime:actualMime});
   };
  });
  recorder.start(250);
  startedAt=performance.now();
  // Refresh frame zero after recording begins, so it is not skipped.
  drawReelFrame(context,offscreen.width,offscreen.height,name,0);
  const drawNext=(now)=>{
   if(completed||document.hidden)return;
   const elapsed=Math.min(duration,Math.max(0,now-startedAt));
   if(elapsed-lastVideoFrame>=lastFrameStep||elapsed===duration){
    drawReelFrame(context,offscreen.width,offscreen.height,name,elapsed);
    lastVideoFrame=elapsed;
    recordReelButton.textContent='● 제작 중 '+Math.min(100,Math.round(elapsed/duration*100))+'%';
   }
   if(elapsed>=duration){
    completed=true;
    if(recorder.state==='recording')recorder.stop();
    return;
   }
   frameId=requestAnimationFrame(drawNext);
  };
  frameId=requestAnimationFrame(drawNext);
  guard=setTimeout(()=>{
   if(!completed&&recorder?.state==='recording'){
    completed=true;cancelAnimationFrame(frameId);recorder.stop();
   }
  },duration+2200);
  const video=await recorded;
  showReelPreview(video.blob,name,video.mime);
  notify('인스타용 세로 영상이 완성됐어요!');
 }catch(error){
  console.warn('Christmas reel export failed',error);
  notify('영상 제작에 실패했습니다. 전체 화면 Safari에서 다시 시도해 주세요.');
 }finally{
  if(guard)clearTimeout(guard);
  if(frameId)cancelAnimationFrame(frameId);
  if(recorder?.state==='recording'){try{recorder.stop()}catch(e){}}
  if(stream)stream.getTracks().forEach(track=>track.stop());
  if(offscreen)offscreen.remove();
  artRoot.classList.remove('reel-recording');
  reelBusy=false;recordReelButton.disabled=false;recordReelButton.textContent='▶ 릴스 영상 만들기';
 }
}
async function downloadReel(){
 if(!currentReel)return;
 const {blob,fileName,mime,mp4}=getVideoFile();
 // iOS Safari commonly saves files to Files, not Photos. The native sharing
 // sheet provides the "Save Video" action when the OS supports it.
 if(mp4&&typeof navigator.share==='function'&&typeof File==='function'){
  const file=new File([blob],fileName,{type:mime});
  if(navigator.canShare?.({files:[file]})){
   try{
    await navigator.share({files:[file],title:'골프채공작소 크리스마스 릴스'});
    reelStatus.textContent='공유 메뉴에서 ‘비디오 저장’을 선택하면 사진 앱에 저장할 수 있습니다.';
    return;
   }catch(e){
    if(e?.name==='AbortError')return;
    console.warn('Native Save Video is unavailable, using download',e);
   }
  }
 }
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.download=fileName;a.href=url;
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),5000);
 reelStatus.textContent=mp4?'MP4 파일을 저장했습니다. 릴스에서 동영상을 가져오세요.':
  'WebM 파일을 저장했습니다. 인스타그램에 올리려면 MP4로 변환해야 할 수 있습니다.';
}

const artRoot=document.getElementById('christmasArt'),artName=document.getElementById('christmasArtName');
const prefersLessMotion=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches||false;
let artStart=0,artStopTimer=null,artParticles=[],artRun=0;


/*
 * Cinematic fireworks engine. Shells rise from the horizon, then break into
 * irregular chrysanthemum, willow and peony sparks with velocity, air drag,
 * gravity and fading trails. No circular outlines, CSS star stamps or emoji.
 * Painted only to a transparent canvas BEHIND the tree.
 */
const fxPalettes=[
 ['#fff8df','#ffdb90','#d99445'],
 ['#f1fcff','#b0e5f7','#689dbf'],
 ['#fff4e3','#ffbdac','#c97d79'],
 ['#f9f3ff','#d7c6ee','#9d91c6'],
 ['#fff8cc','#efcd83','#be944a']
];
let fxPending=[],fxRockets=[],fxSparks=[],fxFlares=[],fxInitAt=0,fxLast=0,fxNextAmbient=0,fxShowIndex=0;
const fxRnd=(min,max)=>min+Math.random()*(max-min);
function queueFirework(seconds,x,y,palette=0,kind=0,power=1,base=performance.now()){
 fxPending.push({at:base+seconds*1000,x,y,palette,kind,power});
}
function queueNameFireworks(base=performance.now()){
 // Alternating fireworks on either side of the tree, natural varying timing.
 const plan=[
  [.35,.15,.29,0,2,.82],     // first small gold
  [1.06,.85,.39,1,0,.89],     // a blue response
  [1.74,.17,.44,2,1,.88],
  [2.20,.81,.24,4,0,1.02],
  [2.73,.12,.55,1,2,.91],
  [3.07,.84,.51,3,1,1.02],
  [3.28,.31,.16,0,0,1.08],
  [3.47,.68,.21,0,2,1.10],
  [3.70,.50,.17,4,1,1.22]    // high-center gold finale
 ];
