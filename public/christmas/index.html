<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>골프채공작소 | Merry Christmas</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#030711;color:#fff;font-family:system-ui,sans-serif}canvas{display:block;touch-action:none}.top,.bottom,.hint{position:absolute;width:100%;text-align:center;pointer-events:none}.top{top:7%;font-size:13px;letter-spacing:.2em;color:#ffda83}.bottom{bottom:9%;font-size:clamp(25px,7vw,38px);font-weight:800;text-shadow:0 0 18px #8df5b2}.bottom small{display:block;font-size:12px;font-weight:400;letter-spacing:.3em;color:#e8c47e;margin-top:8px}.hint{bottom:3%;font-size:11px;color:#9fa7b7}</style></head><body><div class="top">✦ MERRY CHRISTMAS ✦</div><canvas id="c"></canvas><div class="bottom">골프채공작소<small>CLUBMAKERS</small></div><div class="hint">손가락으로 트리를 돌려보세요 ✨</div><script>(()=>{const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,dpr,rot=0,drag=false,last=0,seed=2026;const rand=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296),pts=[],stars=[];for(let i=0;i<1700;i++){let h=rand(),a=rand()*6.283,r=Math.sqrt(rand())*(1-h)*1.2;pts.push({x:Math.cos(a)*r,y:1.35-h*2.65,z:Math.sin(a)*r,ch:'*+xo%@'[Math.floor(rand()*6)],phase:rand()*6.283,col:rand(),orn:i%32===0})}for(let i=0;i<100;i++)stars.push({x:rand(),y:rand(),r:.4+rand()*1.4,p:rand()*6.28});function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();c.addEventListener('pointerdown',e=>{drag=true;last=e.clientX;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(drag){rot+=(e.clientX-last)*.009;last=e.clientX}});c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);function frame(t){let bg=g.createRadialGradient(W/2,H*.47,0,W/2,H*.47,Math.max(W,H)*.7);bg.addColorStop(0,'#112b20');bg.addColorStop(1,'#030711');g.fillStyle=bg;g.fillRect(0,0,W,H);for(let p of stars){g.globalAlpha=.2+.5*(.5+.5*Math.sin(t*.001+p.p));g.fillStyle='#dceaff';g.beginPath();g.arc(p.x*W,p.y*H,p.r,0,6.283);g.fill()}g.globalAlpha=1;if(!drag)rot+=.003;let s=Math.min(W*.34,H*.21,180),cy=H*.46,cx=W/2,co=Math.cos(rot),si=Math.sin(rot);let arr=pts.map(p=>{let z=p.x*si+p.z*co,k=3.6/(3.6+z*.4);return {p,z,x:cx+(p.x*co-p.z*si)*s*k,y:cy-p.y*s*k,k}}).sort((a,b)=>b.z-a.z);g.textAlign='center';g.textBaseline='middle';for(let v of arr){let p=v.p,pulse=.5+.5*Math.sin(t*.003+p.phase);g.globalAlpha=.45+.55*pulse;if(p.orn){g.fillStyle=['#ff647b','#ffd56d','#8fbaff','#e894ff'][Math.floor(p.col*4)];g.shadowColor=g.fillStyle;g.shadowBlur=12;g.beginPath();g.arc(v.x,v.y,3*v.k,0,6.283);g.fill();g.shadowBlur=0}else{g.fillStyle=p.col<.07?'#ffdf88':p.col<.2?'#d4ffc0':p.col<.5?'#60e39b':'#80b98b';g.font=Math.max(7,s*.066*v.k)+'px monospace';g.fillText(p.ch,v.x,v.y)}}g.globalAlpha=1;g.save();g.translate(cx,cy-1.48*s);g.shadowColor='#ffdc78';g.shadowBlur=25;g.fillStyle='#ffda73';g.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?9:20;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath();g.fill();g.restore();requestAnimationFrame(frame)}requestAnimationFrame(frame)})();</script></body></html>
