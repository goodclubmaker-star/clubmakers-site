/*
 * Festive silent star fireworks. All pixels are drawn above the greeting veil
 * in a separate transparent canvas. On new name, restart five overlapping bursts.
 * No audio, no extra downloads, no third-party dependencies.
 */
let fireworkJobs=[],fireworkSparks=[];

  {delay:.08,x:.22,y:.235,amount:54,kind:0},
  {delay:.68,x:.79,y:.30,amount:56,kind:1},
  {delay:1.28,x:.22,y:.58,amount:49,kind:2},

 fireworkCtx.clearRect(0,0,W,H);

 const scale=Math.max(.55,Math.min(1.25,Math.min(W,H)/600));

  const a=i*Math.PI*2/job.amount+phase+(Math.random()-.5)*.19;
  const power=(92+Math.random()*162)*scale;
  const size=1.1+Math.random()*2.5;
  const colour=fireworkColors[(i+job.kind*2)%fireworkColors.length];
  fireworkSparks.push({
   start:job.delay,x:job.xPx,y:job.yPx,vx:Math.cos(a)*power,
   vy:Math.sin(a)*power,life:.88+Math.random()*.73,
   colour,size,phase:Math.random()*Math.PI*2,star:i%6===0,
   spiral:Math.random()>.7
  });
 }
}
function drawStarCross(gc,x,y,r,rot){
 gc.save();gc.translate(x,y);gc.rotate(rot);

/* Large fireworks BEHIND the tree. Rendered into the main canvas immediately

   x,y,start:t,vx:Math.cos(angle)*speed*spread,
   vy:Math.sin(angle)*speed*spread,colour,
   duration:860+Math.random()*680,
   star:i%7===0,size:1+Math.random()*1.65,phase:Math.random()*6.28
