<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>골프채공작소 크리스마스트리</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#030913;color:white;font-family:system-ui,-apple-system,sans-serif}canvas{width:100%;height:100%;display:block;touch-action:none}.header{position:absolute;top:max(18px,env(safe-area-inset-top));left:0;right:0;text-align:center;color:#f7d99a;font-size:12px;letter-spacing:3px;pointer-events:none}.footer{position:absolute;bottom:calc(105px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 0 18px #5fd99b}.footer b{font-size:clamp(22px,6vw,32px)}.footer small{display:block;letter-spacing:4px;color:#ebca8a;margin-top:4px;font-size:10px}.controls{position:absolute;bottom:calc(17px + env(safe-area-inset-bottom));left:12px;right:12px;display:flex;justify-content:center;gap:8px;align-items:center}.controls input{min-width:0;max-width:185px;flex:1;padding:12px;border:1px solid #8dba9c;border-radius:24px;background:#101c20;color:white;font-size:16px}.controls button{border:0;border-radius:24px;background:#e8bd65;color:#142117;padding:12px 16px;font-weight:800;font-size:14px}.tip{position:absolute;bottom:calc(76px + env(safe-area-inset-bottom));width:100%;text-align:center;font-size:11px;color:#c2cbbf;pointer-events:none}.toast{position:absolute;top:14%;left:12%;right:12%;text-align:center;color:#ffe9b2;pointer-events:none;font-size:14px;opacity:0;transition:opacity .25s}.toast.show{opacity:1}</style></head><body><canvas id="tree" aria-label="회전하는 크리스마스트리"></canvas><div class="header">✦ MERRY CHRISTMAS ✦</div><div id="toast" class="toast"></div><div class="footer"><b>골프채공작소</b><small>CLUBMAKERS</small></div><div class="tip">↔ 손가락으로 회전 · 이름 장식을 터치해보세요</div><form class="controls" id="form"><input id="name" maxlength="12" placeholder="트리에 달 이름" aria-label="트리에 달 이름" autocomplete="off"><button type="submit">✨ 이름 달기</button></form><script>
(()=>{'use strict';const canvas=document.getElementById('tree'),ctx=canvas.getContext('2d'),input=document.getElementById('name'),toast=document.getElementById('toast');let W=0,H=0,dpr=1,rotation=0,drag=false,lastX=0,moved=false,zoom=1,seed=2026,ornaments=[],labels=[],projected=[];const rand=()=>((seed=(Math.imul(seed,1664525)+1013904223)>>>0)/4294967296);const pts=[];for(let i=0;i<1250;i++){const h=rand(),a=rand()*Math.PI*2,r=(1-h)*Math.sqrt(rand());pts.push({x:Math.cos(a)*r,y:1-2*h,z:Math.sin(a)*r,phase:rand()*6.28,ch:['+','*','o','x','@'][Math.floor(rand()*5)],color:rand()})}for(let i=0;i<45;i++){let h=.1+rand()*.84,a=rand()*Math.PI*2,r=(1-h)*.98;ornaments.push({x:Math.cos(a)*r,y:1-2*h,z:Math.sin(a)*r,color:['#ffd66b','#ff6b89','#8ebaff','#db9aff'][i%4],phase:rand()*6.28})}const stars=Array.from({length:65},()=>({x:rand(),y:rand(),r:.5+rand()*1.2,p:rand()*6.28}));function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const key='clubmakers-christmas-names-v1';try{const saved=JSON.parse(sessionStorage.getItem(key)||'[]');if(Array.isArray(saved))labels=saved.filter(x=>typeof x==='string').slice(0,8).map((name,i)=>makeLabel(name,i))}catch{}function makeLabel(name,i){const h=.23+(i%7)*.095,a=i*2.399+1.3,r=(1-h)*1.04;return{name,x:Math.cos(a)*r,y:1-2*h,z:Math.sin(a)*r,born:performance.now(),phase:i*1.7}}function notify(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1900)}document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const name=input.value.trim().replace(/[<>]/g,'').slice(0,12);if(!name)return;labels.push(makeLabel(name,labels.length));if(labels.length>8)labels.shift();try{sessionStorage.setItem(key,JSON.stringify(labels.map(l=>l.name)))}catch{}input.value='';input.blur();notify(name+'님의 이름이 트리에 달렸어요 ✨')});canvas.addEventListener('pointerdown',e=>{drag=true;moved=false;lastX=e.clientX;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lastX;if(Math.abs(dx)>2)moved=true;rotation+=dx*.009;lastX=e.clientX});canvas.addEventListener('pointerup',e=>{drag=false;if(!moved){const hit=projected.slice().reverse().find(p=>Math.hypot(p.x-e.clientX,p.y-e.clientY)<Math.max(22,p.width/2));if(hit)notify('✨ '+hit.name+'님, 메리 크리스마스! ✨')}});canvas.addEventListener('pointercancel',()=>drag=false);function frame(t){ctx.clearRect(0,0,W,H);const grad=ctx.createRadialGradient(W/2,H*.4,0,W/2,H*.4,Math.max(W,H)*.7);grad.addColorStop(0,'#123027');grad.addColorStop(1,'#030913');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);for(const s of stars){ctx.globalAlpha=.15+.5*(.5+.5*Math.sin(t*.001+s.p));ctx.fillStyle='#d8e8ff';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,7);ctx.fill()}ctx.globalAlpha=1;if(!drag)rotation+=.0024;const usableTop=Math.max(65,H*.12),usableBottom=Math.min(H-190,H*.77),available=Math.max(150,usableBottom-usableTop),scale=Math.min(W*.39,available*.44)*zoom,cx=W/2,cy=(usableTop+usableBottom)/2;const sn=Math.sin(rotation),cs=Math.cos(rotation);function pos(p){const x=p.x*cs-p.z*sn,z=p.x*sn+p.z*cs;const depth=3.5/(3.5+z*.16);return{x:cx+x*scale*depth,y:cy-p.y*scale*depth,z,depth}}const items=pts.map(p=>({p,...pos(p)})).sort((a,b)=>b.z-a.z);ctx.textAlign='center';ctx.textBaseline='middle';for(const v of items){const glow=.55+.45*Math.sin(t*.003+v.p.phase);ctx.globalAlpha=.35+.6*glow;ctx.fillStyle=v.p.color<.1?'#ffdc83':v.p.color<.35?'#c8ffcb':v.p.color<.7?'#6de3a0':'#419c79';ctx.font=Math.max(8,scale*.065*v.depth)+'px monospace';ctx.fillText(v.p.ch,v.x,v.y)}ctx.globalAlpha=1;for(const o of ornaments){const p=pos(o);ctx.globalAlpha=.65+.35*Math.sin(t*.004+o.phase);ctx.fillStyle=o.color;ctx.shadowColor=o.color;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(2.5,scale*.026)*p.depth,0,7);ctx.fill()}ctx.shadowBlur=0;ctx.globalAlpha=1;const top=pos({x:0,y:1.09,z:0});ctx.save();ctx.translate(top.x,top.y);ctx.shadowColor='#ffdc69';ctx.shadowBlur=25;ctx.fillStyle='#ffe082';ctx.beginPath();const radius=Math.max(12,scale*.12);for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=radius*(i%2?.46:1);ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.restore();projected=[];for(const l of labels.map(p=>({p,...pos(p)})).sort((a,b)=>b.z-a.z)){const age=Math.min(1,(t-l.p.born)/850),arrival=Math.max(0,age),y=l.y-(1-arrival)*100;ctx.font='bold '+Math.max(12,Math.min(19,scale*.11))+'px system-ui';const width=ctx.measureText(l.p.name).width+24;ctx.globalAlpha=.75+.25*Math.sin(t*.005+l.p.phase);ctx.shadowColor='#ffe38b';ctx.shadowBlur=12+8*Math.sin(t*.004+l.p.phase);ctx.fillStyle='rgba(22,36,29,.85)';ctx.beginPath();ctx.roundRect(l.x-width/2,y-14,width,28,14);ctx.fill();ctx.strokeStyle='#f8d47b';ctx.lineWidth=1.2;ctx.stroke();ctx.fillStyle='#ffe9a8';ctx.shadowBlur=9;ctx.fillText(l.p.name,l.x,y+1);projected.push({x:l.x,y,width,name:l.p.name})}ctx.shadowBlur=0;ctx.globalAlpha=1;requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
</script></body></html>
