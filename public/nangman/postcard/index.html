<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>낭만엽서가 도착했어요</title>
<meta name="description" content="손글씨 엽서를 열어 보세요.">
<!-- 링크 미리보기는 모든 엽서가 같은 봉투 그림과 문구다. 이름·본문·사진·손글씨를 넣지 않는다.
     og:url은 일부러 넣지 않는다(미리보기 카드가 토큰 없는 주소로 연결되지 않게). -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="낭만엽서">
<meta property="og:title" content="🕊️ 낭만엽서가 도착했어요">
<meta property="og:description" content="손글씨 엽서를 열어 보세요.">
<meta property="og:image" content="https://myclubmakers.com/nangman/postcard/og-envelope-20261012.png">
<meta property="og:image:alt" content="비둘기 우표가 붙은 낭만엽서 봉투">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#8FB8E8">
<link rel="stylesheet" href="./postcard-20261014-video-a.css">
<link rel="stylesheet" href="./postcard-sealed-20261014-a.css">
<script defer src="./i18n-20261016-en-a.js?v=20261024"></script>
<script type="module" src="./player-20261016-aftertap-autoplay-a.js?v=20261024"></script>
</head>
<body data-view="loading">
<main>
  <section class="view view-loading" aria-live="polite">
    <img class="loading-dove" src="./stamp-dove-20261012.png" width="340" height="340" alt="" aria-hidden="true">
    <p class="loading-text">엽서를 가져오고 있어요</p>
  </section>

  <section class="view view-envelope">
    <div class="arrival-heading">
      <img class="arrival-dove" src="./stamp-dove-20261012.png" width="340" height="340" alt="" aria-hidden="true">
      <h1 class="greeting" id="greeting">낭만엽서가 도착했어요</h1>
    </div>
    <button type="button" class="envelope" id="openEnvelope" aria-label="봉투 열기">
      <span class="env-back"></span>
      <span class="env-letter"></span>
      <span class="env-pocket"></span>
      <span class="env-flap"><span class="env-seal"></span></span>
      <img class="env-stamp" src="./stamp-dove-20261012.png" alt="" width="340" height="340">
    </button>
    <p class="hint">봉투를 눌러 열어 보세요</p>
  </section>

  <section class="view view-player">
    <p class="from-line" id="fromLine"></p>
    <figure class="card">
      <canvas id="card" aria-label="손글씨 엽서"></canvas>
    </figure>
    <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
    <div class="controls" id="controls">
      <button type="button" class="control control-main" id="playButton">일시정지</button>
      <button type="button" class="control" id="restartButton">처음부터</button>
      <button type="button" class="control" id="finishButton">완성본 보기</button>
    </div>

    <button type="button" class="control video-save" id="saveVideoButton">🎬 손글씨 영상 저장</button>
    <p class="video-save-status" id="videoSaveStatus" role="status" aria-live="polite"></p>
    <p class="note" id="note"></p>
    <a class="reply-cta" id="replyButton" href="https://apps.apple.com/kr/app/%EB%82%AD%EB%A7%8C%EC%97%BD%EC%84%9C/id6821494515" rel="noopener noreferrer" aria-describedby="replyNotice">
      <span class="reply-title">💌 답장하기</span>
      <span class="reply-subtitle">App Store에서 무료로 설치하기</span>
    </a>
    <p class="reply-notice" id="replyNotice">낭만엽서가 출시되었어요. 앱을 무료로 설치한 뒤 직접 손글씨 엽서를 보내보세요.</p>
    <p class="footer"><a href="/nangman/">낭만공작소 둘러보기</a></p>
  </section>

  <section class="view view-sealed" aria-live="polite">
    <p class="sealed-kicker">특별 우표</p>
    <h1 class="sealed-title">시간을 담아 보내는 편지</h1>
    <p class="sealed-from" id="sealedFrom">엽서가 오고 있어요</p>
    <div class="envelope is-sealed" aria-hidden="true">
      <span class="env-back"></span>
      <span class="env-letter"></span>
      <span class="env-pocket"></span>
      <span class="env-flap"><span class="env-seal"></span></span>
      <img class="env-stamp" src="./stamp-dove-20261012.png" alt="" width="340" height="340">
      <span class="sealed-lock">🔒</span>
    </div>
    <p class="sealed-label">도착 예정</p>
    <p class="sealed-date" id="sealedDate"></p>
    <p class="sealed-countdown" id="sealedCountdown"></p>
    <a class="control control-main sealed-calendar" id="sealedCalendar" href="#">📅 도착일 알림 받기</a>
    <p class="sealed-note">캘린더에 도착 시간이 저장되고, 그때 알림이 와요. 연락처는 받지 않아요.<br>이 링크를 간직해 두세요. 도착하면 여기서 바로 열 수 있어요.</p>
  </section>

  <section class="view view-error" aria-live="polite">
    <div class="empty-envelope" aria-hidden="true"></div>
    <h1 class="error-title" id="errorTitle"></h1>
    <p class="error-body" id="errorBody"></p>
    <button type="button" class="control control-main" id="retryButton" hidden>다시 불러오기</button>
  </section>
</main>
</body>
</html>
