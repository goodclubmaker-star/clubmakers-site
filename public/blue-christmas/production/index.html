r:zoom-in}.missing{padding:80px 20px;color:#9ba6b4;text-align:center;line-height:1.8}.visualTag{position:absolute;top:12px;left:12px;padding:6px 9px;border-radius:4px;color:#fff;background:#0e1219db;font:700 11px ui-monospace,monospace;z-index:2}.page{display:flex;flex-direction:column;padding:20px 26px 18px;background:linear-gradient(100deg,var(--paper2),var(--paper) 7%)}.eyebrow{font:700 11px ui-monospace,monospace;color:var(--red)}.page h3{font-size:20px;line-height:1.25;margin:6px 0 10px}.label{font:700 10px ui-monospace,monospace;color:var(--blue);letter-spacing:.1em;margin:5px 0 7px}.action{font-size:17px;line-height:1.78;margin:0;white-space:pre-line}.folio{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:#817a6e;font:11px ui-monospace,monospace}.modal{position:fixed;inset:0;z-index:60;background:#05070af2;display:none;align-items:center;justify-content:center;padding:24px}.modal.open{display:flex}.modal img{max-width:96vw;max-height:94vh;object-fit:contain}.modal button{position:absolute;right:18px;top:14px;background:none;border:0;color:white;font-size:34px}@media(max-width:700px){:root{--bar:104px}.top{position:sticky;display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 10px}.brand{min-width:0}.brand b{font-size:15px}.brand span{display:none}.sceneNav{grid-column:1/-1;order:3}.sceneNav button{padding:6px 9px;font-size:12px}.tools{margin:0}.tools button{padding:6px 9px;font-size:12px}.book{padding:6px 0 54px}.sceneIntro{grid-template-columns:66px 1fr;gap:10px;padding:26px 14px 11px}.sceneNo{font-size:30px}.sceneIntro h2{font-size:19px}.spread{border-radius:0;margin-bottom:14px;box-shadow:none}.visual{min-height:0}.visual img{max-height:none}.visualTag{top:8px;left:8px}.page{padding:15px 16px 14px}.page h3{font-size:16px;margin:4px 0 8px}.action{font-size:15px;line-height:1.72}.folio{margin-top:14px;padding-top:9px}}@media print{@page{size:A4 portrait;margin:8mm}.top,.modal{display:none!important}body{background:white}.book{max-width:none;padding:0}.sceneIntro{color:#111;padding:8mm 4mm 4mm;break-before:page}.spread{margin:0 0 8mm;box-shadow:none;border:1px solid #bbb;break-inside:avoid}.visual img{max-height:125mm}.page{padding:7mm}}</style></head><body><audio id="bgm" src="../audio/audio_trimmed_2s.mp3" loop preload="metadata"></audio><header class="top"><div class="brand"><b>우울폭주 성탄절 · 전체 콘티북</b><span>ORIGINAL SCREENPLAY · IMAGE THEN TEXT · S01—S25</span></div><nav class="sceneNav" id="sceneNav"></nav><div class="tools"><button id="editStoryboardBtn" class="editorBtn" type="button" aria-pressed="false" onclick="toggleStoryboardEdit()">편집</button><button id="exportStoryboardBtn" class="editorBtn editOnly" type="button" hidden onclick="exportStoryboardEdits()">백업</button><button id="resetS07Btn" class="editorBtn editOnly" type="button" hidden onclick="resetSceneSeven()">S07 원본</button><button id="musicBtn" class="musicBtn" type="button" aria-pressed="false" onclick="toggleMusic()">♪ MUSIC OFF</button><button onclick="window.print()">인쇄 / PDF</button></div></header><main class="book" id="book"></main><div class="modal" id="modal" onclick="this.classList.remove('open')"><button>×</button><img id="modalImg"></div><script>const scenes=[{"n":1,"title":"서울 도심, 루돌프와 산타 (intro), 밤","meta":"","cuts":[{"id":"S01-C01","img":"../storyboard-assets/S01/S01-C01_webtoon_v001.webp","title":"CUT 01","action":"(1-1) 어두운 분위기의 낮, 혹은 저녁.\n높다란 빌딩 위에서 똑같이 검정 외투를 입고 어색하게 서울을 내려보는 두 사람, 산타 와 루돌프. 어린 애 같은 모습의 산타와 커다란 고글이 얹힌 노란 헬멧을 쓴 루돌프. 산타 커다란 가방을 들고 있다.","dialogue":"","camera":"","note":"","keep":false,"audit":{"status":"pass","text":""}},{"id":"S01-C02","img":"../storyboard-assets/S01/S01-C02_webtoon_v001.webp","title":"CUT 02","action":"산타\n(걱정스러운 말투로) 저기 말야.\n일 년 사이에 너무 변했는 걸. 길을 찾을 수 있겠어?\n\n루돌프\n(오래된 지도를 펼치며)\n나만 믿어. 타고난 길잡이들은 지도를 보는데 능숙하지.","dialogue":"","camera":"","note":"","keep":false,"audit":{"status":"pass","text":""}},{"id":"S01-C03","img":"../storyboard-assets/S01/S01-C03_webtoon_v001.webp","title":"CUT 03","action":"산타\n글쎄.. 좀 알아보겠어?\n\n루돌프\n(기침을 하며) 흠..흠..\n괜찮아. 타고난 길잡이들은 별을 보면 방향을 알 수가 있지.\n일단 좀 둘러보자.","dialogue":"","camera":"","note":"","keep":false,"audit":{"status":"pass","text":""}},{"id":"S01-C04","img":"../storyboard-assets/S01/S01-C04_webtoon_v001.webp","title":"CUT 04","action":"(1-2)\n도심을 헤메는 두 사람. 정신없다.\n지나가는 사람들과 오토바이, 빵빵거리는 차에 놀라는 루돌프.","dialogue":"","camera":"","note":"","keep":false,"audit":{"status":"pass","text":""}},{"id":"S01-C05","img":"../storyboard-assets/S01/S01-C05_webtoon_v001.webp","title":"CUT 05","action":"아무렇지도 않은 채하며,\n\n루돌프\n걱정마. 처음엔 다 떨리는 법이야.\n손 꼭 잡어. 내 손을 놓치면 안 돼. 길 잃어버리지 말고 말야.\n그런데 참 정신 없다. 그지?","dialogue":"","camera":"","note":"","keep":false,"audit":{"status":"pass","text":""}},{"id":"S01-C06","img":"../storyboard-assets/S01/S01-C06_webtoon_v001.webp","title":"CUT 06","action":"루돌프 돌아보면 뒤엔 아무도 없다.\n많은 사람들이 지나가고.","dialogue":"","camera":"","note":"","keep":false,"audit":{"status":"pass","text":""}},{"id":"S01-C07","img":"../storyboard-assets/S01/S01-C07_webtoon_v001.webp","title":"CUT 07","action":"혼자 남는 산타.\n수많은 인파 속에 묻혀버린 산타.\n아무리 찾아도 루돌프의 모습은 보이지 않는다.","dialogue":"","camera":"","note":"","keep":false,"audit":{"status":"pass","text":""}},{"id":"S01-C08","img":"../storyboard-assets/S01/S01-C08_webtoon_v001.webp","title":"CUT 08","action":"혼자 멍하니 서있는 산타.\n당황한 루돌프.","dialogue":"","camera":"","note":"","keep":false,"audit":{"status":"pass","text":""}}]},{"n":2,"title":"자막","meta":"","cuts":[{"id":"S02-C01","img":"../storyboard-assets/S02/S02-C01_webtoon_v001.webp","title":"CUT 01","action":"검은 우주 공간, 수없이 많은 별들 사이로 지나가는 듯한 느낌.","dialogue":"","camera":"","note":"","keep":false,"audit":{"status":"pass","text":""}},{"id":"S02-C02","img":"../storyboard-assets/S02/S02-C02_webtoon_v003.webp","title":"CUT 02","action":"갑자기 커다란 별이 와서 부딪힌다. 꽝!","dialogue":"","camera":"","note":"","keep":false,"audit":{"status":"pass","text":""}},{"id":"S02-C03","img":"../storyboard-assets/S02/S02-C03_webtoon_v003.webp","title":"CUT 03","action":"연달아 부딪히는 별들. 꽝꽝! 소리가 나며, 별들이 글자로 바뀌며 타이틀이 뜬다.","dialogue":"","camera":"","note":"","keep":false,"audit":{"status":"pass","text":""}},{"id":"S02-C04","img":"../storyboard-assets/S02/S02-C04_webtoon_v003.webp","title":"CUT 04","action":"","dialogue":"","camera":"","note":"","keep":false,"audit":{"status":"pass","text":""}}]},{"n":3,"title":"백화점 앞, 낮","meta":"","cuts":[{"id":"S03-C01","img":"../storyboard-assets/S03/S03-C01_webtoon_v001.webp","title":"CUT 01","action":"캐롤송이 울리는 거리. 전광판엔 2002 년 12월 20일이란 날짜가 보인다.","dialogue":"","camera":"","note":"","keep":false,"audit":{"status":"pass","text":""}},{"id":"S03-C02","img":"../storyboard-assets/S03/S03-C02_webtoon_v001.webp","title":"CUT 02","action":"루돌프의 나레이션.)\n내 이름은 루돌프, 알다시피 산타의 길잡이이다.","dialogue":"","camera":"","note":"","keep":false,"audit":{"status":"pass","text":""}},{"id":"S03-C03","img":"../storyboard-assets/S03/S03-C03_webtoon_v001.webp","title":"CUT 03","action":"이 얘기는 작년 이맘때,\n지구에서 미아가 된 내 친구 산타와 그 친구들의 크리스마스 우울담이다.","dialogue":"","camera":"","note":"","keep":false,"audit":{"status":"pass","text":""}},{"id":"S03-C04","img":"../storyboard-assets/S03/S03-C04_webtoon_v001.webp","title":"CUT 04","action":"연말의 풍경. 커플들이 지나가고 구세군도 보인다.\n크리스마스 트리 불빛이 반짝반짝하는 백화점 앞.","dialogue":"","camera":"","note":"","keep":false,"audit":{"status":"pass","text":""}},{"id":"S03-C05","img":"../storyboard-assets/S03/S03-C05_webtoon_v001.webp","title":"CUT 05","action":"흰 수염을 달고 산타클로스 복장을 한 백화점직원이 아이들에게 풍선을 나눠주고 있다.","dialogue":"","camera":"","note":"","keep":false,"audit":{"status":"pass","text":""}},{"id":"S03-C06","img":"../storyboard-assets/S03/S03-C06_webtoon_v001.webp","title":"CUT 06","action":"짧은 자막\n\"기억을 잃어버린 산타가 만난 지구의 외계인, 꿀벌의 춤을 추는 외로운 시인\"","dialogue":"","camera":"","note":"","keep":false,"audit":{"status":"pass","text":""}},{"id":"S03-C07","img":"../storyboard-assets/S03/S03-C07_webtoon_v001.webp","title":"CUT 07","action":"","dialogue":"","camera":"","note":"","keep":false,"audit status":"pass","text":""}},{"id":"S05-C03","img":"../storyboard-assets/S05/S05-C03_webtoon_v002.webp","title":"CUT 03","action":"손을 비비며 시계를 보는 혁. 누군가 기다리는 듯 하다.\n\n혁\n저기 온다.","dialogue":"","camera":"","note":"","keep":false,"audit":{"status":"pass","text":""}},{"id":"S05-C04","img":"../storyboard-assets/S05/S05-C04_webtoon_v002.webp","title":"CUT 04","action":"혁 침을 꿀꺽 삼키며 기둥에 몸을 숨긴다.\n이어폰으로 귀를 틀어막고 무표정한 얼굴로 주머니에 손을 넣고 걸어오는 지민.\n\n혁\n빨리 숨어. 임마.","dialogue":"","camera":"","note":"","keep":false,"audit":{"status":"pass","text":""}},{"id":"S05-C05","img":"../storyboard-assets/S05/S05-C05_webtoon_v002.webp","title":"CUT 05","action":"산타\n왜..\n\n혁\n쟤 이쁘지.\n\n산타\n어..","dialogue":"","camera":"","note":"","keep":false,"audit":{"status":"pass","text":""}},{"id":"S05-C06","img":"../storyboard-assets/S05/S05-C06_webtoon_v002.webp","title":"CUT 06","action":"산타, 혁에게 조용히 말한다.\n\n산타\n그때가 되면 가야하거든. 벌써 일년이나 지났으니까 말야.\n\n혁\n어디?\n\n산타\n내 고향별.\n\n혁\n미친 새끼.","dialogue":"","camera":"","note":"","keep":false,"audit":{"status":"pass","text":""}},{"id":"S05-C07","img":"../storyboard-assets/S05/S05-C07_webtoon_v002.webp","title":"CUT 07","action":"갑자기 넘어지는 지민.\n혁 뛰쳐나가 지민을 일으켜 세우려고 한다.\n지민 아무 일 없었던 듯 일어나서 가던 길을 간다.\n산타 살짜기 나온다.","dialogue":"","camera":"","note":"","keep":false,"audit":{"status":"pass","text":""}},{"id":"S05-C08","img":"../storyboard-assets/S05/S05-C08_webtoon_v003.webp","title":"CUT 08","action":"혁\n쟤 진짜 이쁘지않냐.\n\n산타\n고맙다는 말도 없네..\n\n혁\n임마, 그런 게 매력이라는 거야.","dialogue":"","camera":"","note":"","keep":false,"audit":{"status":"pass","text":""}}]},{"n":6,"title":"흑석동. 산꼭대기.","meta":"","cuts":[{"id":"S06-C01","img":"../storyboard-assets/S06/S06-C01_webtoon_v001.webp","title":"CUT 01","action":"산타와 혁이 나란히 앉아 있다.\n혁은 담배를 물고 있다.","dialogue":"","camera":"","note":"","keep":false,"audit":{"status":"pass","text":""}},{"id":"S06-C02","img":"../storyboard-assets/S06/S06-C02_master_v001.webp","title":"CUT 02","action":"산타\n크리스마스가 오기 전에, 저기 보이지. 저게 목성이야.","dialogue":"","camera":"","note":"", lass="action">${esc(c.action)}</p>`:''}<div class="folio"><span>${esc(c.id)}</span><span>${String(folio).padStart(3,'0')} / ${String(all.length).padStart(3,'0')}</span></div></div></article>`}).join('')}`).join('');}function openImage(src){document.getElementById('modalImg').src=src;document.getElementById('modal').classList.add('open')}async function toggleMusic(){const audio=document.getElementById('bgm');const btn=document.getElementById('musicBtn');if(!audio||!btn)return;if(!audio.paused){audio.pause();btn.classList.remove('on');btn.textContent='♪ MUSIC OFF';btn.setAttribute('aria-pressed','false');return}btn.disabled=true;try{await audio.play();btn.classList.add('on');btn.textContent='♪ MUSIC ON';btn.setAttribute('aria-pressed','true')}catch{btn.textContent='♪ 다시 눌러 재생'}finally{btn.disabled=false}}render();const io=new IntersectionObserver(es=>{const v=es.find(e=>e.isIntersecting);if(!v)return;document.querySelectorAll('.sceneNav button').forEach(b=>b.classList.toggle('active',b.dataset.scene===v.target.id.replace('scene-','')))},{threshold:.2});document.querySelectorAll('.sceneIntro').forEach(x=>io.observe(x));</script><script src="production-board.js?v=6b8885a"></script></body></html>
