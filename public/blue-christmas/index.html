const KEY='bluechristmas_review_v1';let state=JSON.parse(localStorage.getItem(KEY)||'{}');state.img=state.img||{};state.cut=state.cut||{};state.custom=state.custom||{};let current=1;
function save(){localStorage.setItem(KEY,JSON.stringify(state));updateSummary()}
function sceneFor(im){return state.img[im.file]?.scene ?? im.scene ?? 0}
function statusFor(f){return state.img[f]?.status||''}
function setImg(f,k,v){state.img[f]=state.img[f]||{};state.img[f][k]=v;save();render()}
function setCut(id,v){state.cut[id]=state.cut[id]||{};state.cut[id].decision=v;save();render()}
function noteCut(id,v){state.cut[id]=state.cut[id]||{};state.cut[id].note=v;save()}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderNav(){let h='';for(let i=1;i<=24;i++)h+=`<button class="${current===i?'active':''}" onclick="current=${i};render()">S#${String(i).padStart(2,'0')}</button>`;h+='<button class="'+(current===0?'active':'')+'" onclick="current=0;render()">미분류</button>';document.getElementById('nav').innerHTML=h}
function imgCard(im){let st=statusFor(im.file),sc=sceneFor(im);return `<div class="card"><img src="images/${encodeURIComponent(im.file)}" onclick="zoom(this.src)"><div class="cardBody"><div class="fname" title="${esc(im.file)}">${esc(im.file)}</div><div class="status"><button class="${st==='OK'?'on ok':''}" onclick="setImg('${im.file}','status','OK')">OK</button><button class="${st==='KEEP'?'on keep':''}" onclick="setImg('${im.file}','status','KEEP')">KEEP</button><button class="${st==='NG'?'on ng':''}" onclick="setImg('${im.file}','status','NG')">NG</button></div><select class="sceneSelect" onchange="setImg('${im.file}','scene',+this.value)"><option value="0">미분류</option>${Array.from({length:24},(_,i)=>`<option value="${i+1}" ${sc===i+1?'selected':''}>S#${String(i+1).padStart(2,'0')}</option>`).join('')}</select></div></div>`}
function cutCard(c){let d=state.cut[c.id]?.decision||'KEEP',n=state.cut[c.id]?.note||'';return `<div class="cut"><div class="cutTop"><span class="cutId">${esc(c.id)}</span><small>${esc(c.where)}</small><div class="cutAction"><button class="${d==='KEEP'?'on keep':''}" onclick="setCut('${c.id}','KEEP')">살림</button><button class="${d==='HOLD'?'on hold':''}" onclick="setCut('${c.id}','HOLD')">보류</button><button class="${d==='REMOVE'?'on remove':''}" onclick="setCut('${c.id}','REMOVE')">삭제</button></div></div><p><b>${esc(c.action)}</b></p>${c.camera?`<p><small>카메라 · ${esc(c.camera)}</small></p>`:''}${c.dialogue?`<p><small>대사/VO · ${esc(c.dialogue)}</small></p>`:''}<textarea class="notes" placeholder="수정·추가 아이디어" oninput="noteCut('${c.id}',this.value)">${esc(n)}</textarea></div>`}
function addCustom(scene){let t=document.getElementById('newCut').value.trim();if(!t)return;state.custom[scene]=state.custom[scene]||[];state.custom[scene].push({id:'NEW-'+scene+'-'+Date.now(),text:t,decision:'KEEP'});save();render()}
function customCards(scene){return (state.custom[scene]||[]).map((c,i)=>`<div class="cut"><div class="cutTop"><span class="cutId">추가컷 ${i+1}</span><div class="cutAction"><button class="on keep">추가</button><button onclick="state.custom[${scene}].splice(${i},1);save();render()">삭제</button></div></div><p>${esc(c.text)}</p></div>`).join('')}
function render(){renderNav();let m=document.getElementById('main');if(current===0){let ims=DATA.images.filter(x=>sceneFor(x)===0);m.innerHTML=`<div class="sceneHead"><div><h2>미분류 이미지</h2><div class="meta">씬을 지정하면 해당 씬으로 이동합니다. 이미지 판정은 OK / KEEP / NG로 저장됩니다.</div></div></div><div class="gallery">${ims.map(imgCard).join('')||'<div class="empty">미분류 이미지 없음</div>'}</div>`;updateSummary();return}let s=DATA.scenes[current-1],ims=DATA.images.filter(x=>sceneFor(x)===current);if(current===7)ims.sort((a,b)=>(/ref-original/i.test(b.file)?1:0)-(/ref-original/i.test(a.file)?1:0));m.innerHTML=`<div class="sceneHead"><div><h2>S#${String(current).padStart(2,'0')} · ${esc(s.meta.place||'')}</h2><div class="meta">${esc(s.meta.time||'')} · ${esc(s.meta.chars||'')}<br><b>포인트</b> · ${esc(s.meta.core||'')}</div></div><span class="badge">이미지 ${ims.length} · 컷 ${s.cuts.length}</span></div><h3 class="sectionTitle">컨셉 이미지 판정</h3><div class="gallery">${ims.map(imgCard).join('')||'<div class="empty">아직 이 씬에 지정된 이미지가 없습니다. 미분류에서 지정하세요.</div>'}</div><h3 class="sectionTitle">컷 구성 검토</h3>${s.cuts.map(cutCard).join('')}${customCards(current)}<div class="addCut"><input id="newCut" placeholder="새로 추가하고 싶은 컷을 한 줄로 입력"><button onclick="addCustom(${current})">+ 컷 추가</button></div>`;updateSummary()}
function zoom(src){document.getElementById('modalImg').src=src;document.getElementById('modal').classList.add('show')}
function updateSummary(){let vals=DATA.images.map(x=>statusFor(x.file));let ok=vals.filter(x=>x==='OK').length,k=vals.filter(x=>x==='KEEP').length,ng=vals.filter(x=>x==='NG').length;document.getElementById('summary').textContent=`이미지 OK ${ok} · KEEP ${k} · NG ${ng} · 미판정 ${DATA.images.length-ok-k-ng}`}
function download(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportJSON(){download('우울폭주_리뷰결과.json',JSON.stringify({version:1,exported:new Date().toISOString(),state},null,2),'application/json')}
function exportCSV(){let rows=[['씬','컷ID','판정','기존 액션','수정메모']];DATA.scenes.forEach(s=>s.cuts.forEach(c=>rows.push([s.scene,c.id,state.cut[c.id]?.decision||'KEEP',c.action,state.cut[c.id]?.note||''])));Object.entries(state.custom).forEach(([s,cs])=>cs.forEach(c=>rows.push([s,c.id,'ADD',c.text,''])));let csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');download('우울폭주_컷리뷰.csv',csv,'text/csv')}
function importJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let j=JSON.parse(r.result);state=j.state||j;save();render()}catch(err){alert('JSON을 읽을 수 없습니다.')}};r.readAsText(f)}
function resetAll(){if(confirm('모든 판정과 메모를 초기화할까요?')){state={img:{},cut:{},custom:{}};save();render()}}
render();</script><script src="images-manifest.js"></script><script src="review-v2.js"></script></body></html>
