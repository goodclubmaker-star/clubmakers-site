<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>실제적인 클럽피팅 연재실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>[hidden]{display:none!important} body{margin:0} img{max-width:100%} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<style>
/* 레이아웃: 좌측 목차(장별) + 우측 작업대(원문 → 검수본 → 일지 파일). 폰에서는 목차/작업대 전환 */
:root{
  --bg:#FAFAF6; --paper:#FFFFFF; --ink:#0F0F0E; --muted:#6B6A62; --line:#E4E1D6;
  --green:#0F2922; --green-soft:#E6EEEA; --gold:#B8985C; --gold-soft:#F4ECDD;
  --done:#2F6B4F; --draft:#9A6B12; --skip:#8A8A84;
  --serif:'Noto Serif KR','Nanum Myeongjo',serif;
  --sans:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121412; --paper:#1A1D1B; --ink:#ECEAE3; --muted:#A3A198; --line:#2E322F;
  --green:#9CC7B4; --green-soft:#1F2B26; --gold:#D2B37A; --gold-soft:#2E281D;
  --done:#7CC19F; --draft:#E0B25C; --skip:#77776F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121412; --paper:#1A1D1B; --ink:#ECEAE3; --muted:#A3A198; --line:#2E322F;
  --green:#9CC7B4; --green-soft:#1F2B26; --gold:#D2B37A; --gold-soft:#2E281D;
  --done:#7CC19F; --draft:#E0B25C; --skip:#77776F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:14px 12px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand small{font-size:11px;letter-spacing:.14em;color:var(--gold);font-weight:700}
.brand h1{margin:0;font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.3}
.meter{display:flex;align-items:center;gap:12px;flex:1 1 260px;max-width:460px}
.bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-done{background:var(--done)} .bar .b-draft{background:var(--draft)}
.meter b{font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 14px;font-size:14px;font-weight:500;line-height:1.3}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--bg)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1408}
.btn:disabled{opacity:.45;cursor:not-allowed}
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;margin-top:20px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)} body.view-detail .toc{display:none} body.view-list .desk{display:none}}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);max-height:calc(100vh - 110px);overflow:auto;padding-right:4px}
@media (max-width:860px){.toc{position:static;max-height:none}}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chipf{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:12.5px}
.chipf[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details.grp{border-top:1px solid var(--line)}
details.grp summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:10px 2px;cursor:pointer;font-weight:700;font-size:14px}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary span{font-weight:500;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.item{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px;align-items:center;width:100%;padding:6px 6px;border-radius:6px;font-size:13.5px;line-height:1.45}
.item .ck{width:17px;height:17px;margin:0;accent-color:var(--green);cursor:pointer}
.item .open{display:grid;grid-template-columns:30px minmax(0,1fr);gap:6px;align-items:center;border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;min-width:0}
.item:hover{background:var(--green-soft)}
.item.cur{background:var(--gold-soft)}
.item .no{font-family:var(--mono);font-size:11px;color:var(--muted)}
.item .tt{min-width:0;overflow-wrap:anywhere}
.st{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;border:1px solid currentColor}
.st.bundle{color:var(--gold)} .st.done{color:var(--done)}
.selbar{position:sticky;top:0;z-index:2;background:var(--gold-soft);border:1px solid var(--gold);border-radius:8px;padding:10px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.selbar b{font-size:13.5px}
.selacts{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:860px){.selbar{top:calc(env(safe-area-inset-top,0px) + var(--toph,72px))}}
.selacts .btn{padding:5px 10px;font-size:13px}
.item.inb{position:relative;border-radius:0}
.item.inb::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.item.inb.inb-done::before{background:var(--done)}
.item.inb-first{border-top-left-radius:6px;border-top-right-radius:6px}
.item.inb-first::before{top:6px;border-radius:3px 3px 0 0}
.item.inb-last{border-bottom-left-radius:6px;border-bottom-right-radius:6px;margin-bottom:6px}
.item.inb-last::before{bottom:6px;border-radius:0 0 3px 3px}
.st.published{color:var(--done)} .st.reviewed{color:var(--draft)} .st.skipped{color:var(--skip)} .st.todo{color:var(--muted);border-color:var(--line)}
.desk{min-width:0;display:flex;flex-direction:column;gap:22px}
.crumb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.crumb .back{display:none}
@media (max-width:860px){.crumb .back{display:inline-block}}
h2.sec{font-family:var(--serif);font-size:24px;line-height:1.4;margin:4px 0 0;text-wrap:balance}
.navrow{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
@media (max-width:520px){.panel{padding:14px}}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.panel-h h3{margin:0;font-size:12px;letter-spacing:.14em;color:var(--gold);font-weight:700}
.orig{font-size:15.5px;line-height:1.85;max-width:72ch}
.orig p{margin:0 0 1em;overflow-wrap:anywhere}
.orig blockquote{margin:0 0 1em;padding:10px 14px;border-left:3px solid var(--gold);background:var(--gold-soft);border-radius:0 6px 6px 0;font-size:14.5px}
.orig blockquote p{margin:0 0 .4em}
.orig .fig{margin:0 0 1em;padding:10px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);font-size:13px;text-align:center}
.tbl{overflow-x:auto;margin:0 0 1.2em}
.tbl table{border-collapse:collapse;font-size:13.5px;line-height:1.55;min-width:100%}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 9px;vertical-align:top;text-align:left}
.tbl th{background:var(--green-soft);font-weight:700}
.collapse{max-height:420px;overflow:hidden;position:relative}
.collapse::after{content:"";position:absolute;inset:auto 0 0;height:80px;background:linear-gradient(transparent,var(--paper))}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
input.t,select.t,textarea.t{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;font-size:15px;width:100%;color:var(--ink)}
textarea.t{min-height:340px;line-height:1.75;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.drop{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
pre.md{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--mono);font-size:12.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto;margin:0}
.steps{display:grid;gap:10px}
.step{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;font-size:14px}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--green);color:var(--bg);display:grid;place-items:center;font-size:12.5px;font-weight:700}
.step .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.note{font-size:12.5px;color:var(--muted)}
.fname{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.banner{background:var(--gold-soft);border:1px solid var(--gold);border-radius:8px;padding:10px 14px;font-size:13.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
.login{max-width:420px;margin:60px auto;display:flex;flex-direction:column;gap:14px}
.login h2{font-family:var(--serif);font-size:22px;margin:0}
.err{color:#B3261E;font-size:13.5px}
.okmsg{color:var(--done);font-size:13.5px}
.setup{display:flex;flex-direction:column;gap:12px}
.busy{opacity:.6;pointer-events:none}
.deskhead{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,72px));z-index:4;background:var(--bg);display:flex;flex-direction:column;gap:10px;padding-block:10px 12px;border-bottom:1px solid var(--line);margin-top:-10px}
.deskhead h2.sec{font-size:22px}
@media (max-width:860px){.deskhead h2.sec{font-size:18px}}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-top:8px;align-items:center;scrollbar-width:thin}
.chiplab{font-size:11.5px;color:var(--muted);white-space:nowrap}
.chip{flex:0 0 auto;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:12.5px}
.chip:hover{border-color:var(--gold)}
.chip[aria-current="true"]{border-color:var(--gold);background:var(--gold-soft)}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
.ttlrow{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 10px;margin:1.6em 0 .6em;padding-top:1em;border-top:1px solid var(--line)}
.ttlrow:first-child{margin-top:0;padding-top:0;border-top:0}
.ttlrow h4.ttl{margin:0;padding:0;border:0}
.ttlacts{display:flex;gap:6px}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--muted)}
.mini:hover{border-color:var(--gold);color:var(--ink)}
.modes{display:flex;gap:4px;background:var(--line);padding:3px;border-radius:9px}
.modes button{border:0;background:transparent;border-radius:7px;padding:6px 12px;font-size:13.5px;font-weight:500;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 6px;font-size:14px}
.pitem:hover{background:var(--green-soft)}
.pitem.cur{background:var(--gold-soft)}
.pitem .tt{font-weight:500;min-width:0;overflow-wrap:anywhere}
.pitem .pdate{grid-row:2;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pitem .st{grid-row:1/3;grid-column:2;align-self:center}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
.ph{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--line)}
.ph figcaption{display:flex;gap:4px;padding:6px 6px 0;min-height:22px}
.phin,.phcov{font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px}
.phin{color:var(--done);border:1px solid var(--done)}
.phcov{color:#1a1408;background:var(--gold)}
.phacts{display:flex;flex-wrap:wrap;gap:4px;padding:6px}
.fixedcat{justify-content:flex-end}
.catfix{display:inline-flex;align-items:center;min-height:42px;padding:0 12px;border:1px dashed var(--gold);border-radius:8px;background:var(--gold-soft);color:var(--ink);font-size:14px;font-weight:500}
.catpick{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:12px}
.catlab{font-size:12.5px;color:var(--muted);font-weight:500;margin-right:4px}
.catpick label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;background:var(--bg)}
.catpick label:has(input:checked){border-color:var(--green);background:var(--green-soft);font-weight:600}
.catpick input{accent-color:var(--green);margin:0}
.naverrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin:-2px 0 12px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.naverrow .note{grid-column:1/-1;margin:0}
.sumr{display:flex;align-items:center;gap:8px}
.grpOpen{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:500;color:var(--green)}
.grpOpen:hover{border-color:var(--gold)}
.bund{display:block;font-size:11px;color:var(--gold)}
.bundcount{font-family:var(--sans);font-size:14px;font-weight:500;color:var(--gold)}
.orig h4.ttl{font-family:var(--serif);font-size:17px}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><small>골프채공작소 · 공작소 작업대</small><h1>실제적인 클럽피팅 연재실</h1></div>
  <nav class="modes" aria-label="작업 고르기"><button type="button" data-mode="serial" aria-pressed="true">원고 연재</button><button type="button" data-mode="posts" aria-pressed="false">작업일지 쓰기</button></nav>
  <div class="meter" id="meterBox" hidden>
    <div class="bar" aria-hidden="true"><i class="b-done" id="bDone"></i><i class="b-draft" id="bDraft"></i></div>
    <b id="meterTxt">0 / 0</b>
    <button class="btn primary" id="nextBtn" type="button">다음 원고</button>
  </div>
</header>

<section class="login" id="loginView" hidden>
  <h2>작업대 열기</h2>
  <p class="note">공작소장 전용 작업대입니다. 비밀번호는 이 기기에 기억됩니다.</p>
  <label class="f" for="pw">비밀번호<input class="t" id="pw" type="password" autocomplete="current-password"></label>
  <button class="btn primary" id="loginBtn" type="button">열기</button>
  <p class="err" id="loginErr" hidden></p>
</section>

<section class="login" id="uploadView" hidden>
  <h2>원고 불러오기</h2>
  <p class="note">『실제적인 클럽피팅』 docx 파일을 고르면 절 단위로 나눠 서버에 보관합니다. 원고를 새 판으로 바꿀 때도 여기서 다시 고르면 됩니다. 진행 상태와 검수본은 절 번호 기준으로 유지됩니다.</p>
  <span class="btn filebtn primary">docx 파일 선택<input type="file" id="bookIn" accept=".docx"></span>
  <p class="note" id="bookMsg"></p>
  <button class="btn" type="button" id="cancelUpload" hidden>작업대로 돌아가기</button>
</section>

<div class="wrap" id="appView" hidden>
  <nav class="toc" aria-label="원고 목차">
    <div class="selbar" id="selbar" hidden>
      <b id="selN"></b>
      <div class="selacts">
        <button class="btn" type="button" id="selView">체크한 원고 보기</button>
        <button class="btn" type="button" id="selDone">완료</button>
        <button class="btn" type="button" id="selPass">패스</button>
        <button class="btn" type="button" id="selUnbundle" hidden>묶음 풀기</button>
        <button class="btn" type="button" id="selClear">선택 해제</button>
      </div>
    </div>
    <div class="filters" role="group" aria-label="상태 필터">
      <button class="chipf" type="button" data-f="all" aria-pressed="true">전체</button>
      <button class="chipf" type="button" data-f="todo" aria-pressed="false">대기</button>
      <button class="chipf" type="button" data-f="bundle" aria-pressed="false">묶음</button>
      <button class="chipf" type="button" data-f="reviewed" aria-pressed="false">검수본</button>
      <button class="chipf" type="button" data-f="published" aria-pressed="false">완료</button>
      <button class="chipf" type="button" data-f="skipped" aria-pressed="false">패스</button>
    </div>
    <div id="toc"></div>
    <p class="note" id="bookInfo" style="margin-top:14px"></p>
    <div class="navrow"><button class="btn" type="button" id="replaceBook">원고 교체</button><button class="btn" type="button" id="logoutBtn">이 기기에서 잠그기</button></div>
  </nav>
  <main class="desk" id="desk"></main>
</div>
<div class="wrap" id="postsView" hidden>
  <nav class="toc" aria-label="작업일지 목록">
    <div class="navrow" style="margin-bottom:12px"><button class="btn primary" type="button" id="newPost">새 일지 쓰기</button></div>
    <div id="postList"></div>
  </nav>
  <main class="desk" id="postDesk"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="/studio/serial/splitter.js?v=1"></script>
<script src="/studio/serial/html2md.js?v=1"></script>
<script>
const API='/api/studio/serial';
const BOOK='실제적인 클럽피팅';
const ST_LABEL={todo:'대기',reviewed:'검수본',published:'등록 완료',skipped:'패스',done:'완료'};
let range=[],token='',sections=[],byId={},progress={},filter='all',curId=null,openGroups=new Set(),cur=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const statusOf=id=>(progress[id]&&progress[id].status)||'todo';
const isDone=id=>['published','skipped','done'].includes(statusOf(id));
function store(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(_){}}
function load(k){try{return localStorage.getItem(k)}catch(_){return null}}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
async function copy(text,msg){try{await navigator.clipboard.writeText(text);toast(msg||'복사했습니다')}catch(e){toast('복사하지 못했습니다. 길게 눌러 복사해 주세요')}}
function show(view){['loginView','uploadView','appView','postsView'].forEach(v=>$('#'+v).hidden=v!==view);$('#meterBox').hidden=view!=='appView';document.querySelector('.modes').hidden=view==='loginView'}

async function api(path,opt={}){
  const res=await fetch(path.startsWith('/api/')?path:API+path,{...opt,headers:{authorization:'Bearer '+token,...(opt.body?{'content-type':'application/json'}:{})}});
  const raw=await res.text();let data={};try{data=JSON.parse(raw)}catch(_){data={message:raw?('요청 실패 ('+res.status+') '+raw.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,200)):''}}
  if(res.status===401){store('studioToken',null);token='';show('loginView');throw new Error(data.message||'비밀번호가 맞지 않습니다.')}
  if(!res.ok) throw new Error(data.message||('요청 실패 ('+res.status+')'));
  return data;
}

/* ---------- 로그인 ---------- */
async function login(pw){
  token=pw;
  const err=$('#loginErr');err.hidden=true;
  try{const st=await api('/state');store('studioToken',pw);applyState(st)}
  catch(e){err.textContent=e.message;err.hidden=false;show('loginView')}
}
$('#loginBtn').onclick=()=>{const v=$('#pw').value.trim();if(v)login(v)};
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click()});
$('#logoutBtn').onclick=()=>{store('studioToken',null);token='';$('#pw').value='';show('loginView')};

function applyState(st){
  sections=st.sections||[];progress=st.progress||{};
  byId=Object.fromEntries(sections.map((s,i)=>[s.id,{...s,idx:i}]));
  if(!sections.length){show('uploadView');$('#cancelUpload').hidden=true;return}
  const b=st.book;$('#bookInfo').textContent=b?`원고: ${b.source||'-'} · ${b.count}개 · ${b.uploaded_at} 불러옴`:'';
  show('appView');renderToc();renderMeter();
  if(routePosts()){}
  else if(goHash()){} else if(!curId){document.body.className='view-list';showWelcome()} else go(curId,false);
}
async function refresh(){try{const st=await api('/state');sections=st.sections;progress=st.progress;renderToc();renderMeter()}catch(_){}}

/* ---------- 원고 불러오기 ---------- */
$('#replaceBook').onclick=()=>{show('uploadView');$('#cancelUpload').hidden=false;$('#bookMsg').textContent=''};
$('#cancelUpload').onclick=()=>show('appView');
$('#bookIn').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const msg=$('#bookMsg');msg.className='note';msg.textContent='원고를 읽는 중입니다…';
  try{
    const zip=await JSZip.loadAsync(await f.arrayBuffer());
    const xml=await zip.file('word/document.xml').async('string');
    const secs=SerialSplitter.split(xml);
    if(secs.length<10) throw new Error('절 제목을 찾지 못했습니다. 『실제적인 클럽피팅』 원고 파일이 맞는지 확인해 주세요.');
    msg.textContent=`${secs.length}개로 나눴습니다. 서버에 올리는 중…`;
    await api('/sections',{method:'PUT',body:JSON.stringify({source:f.name,sections:secs})});
    msg.className='okmsg';msg.textContent=`${f.name} · ${secs.length}개 불러오기 완료`;
    const st=await api('/state');applyState(st);toast('원고를 불러왔습니다');
  }catch(err){msg.className='err';msg.textContent=err.message||'원고를 읽지 못했습니다.'}
};

/* ---------- 원문 렌더 ---------- */
function renderText(text){
  return text.split(/\n\n/).map(b=>{
    b=b.trim();if(!b)return '';
    if(b==='[그림]')return '<div class="fig">[그림 자리]</div>';
    if(b.startsWith('|')){
      const rows=b.split('\n').filter(l=>!/^\|(-{3}\|)+$/.test(l)).map(l=>l.replace(/^\|\s?|\s?\|$/g,'').split(' | '));
      return '<div class="tbl"><table><thead><tr>'+rows[0].map(c=>`<th>${esc(c)}</th>`).join('')+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+r.map(c=>`<td>${esc(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>';
    }
    if(b.startsWith('> '))return '<blockquote>'+b.split('\n').map(l=>`<p>${esc(l.replace(/^> ?/,'')).replace(/ \/ /g,'<br>')}</p>`).join('')+'</blockquote>';
    return `<p>${esc(b)}</p>`;
  }).join('');
}

/* ---------- 목차 ---------- */
// range = 지금 체크(선택)된 절들 = 작업대에 열린 원고. 맨 앞 절이 묶음의 대표.
const leadOf=id=>(progress[id]&&progress[id].lead)||id;
const byOrd=(a,b)=>byId[a].idx-byId[b].idx;
function bundleOf(id){const p=progress[id];if(range.length>1&&range.includes(id))return range[0];if(p&&p.lead)return p.lead;if(p&&p.members&&p.members.length>1)return id;return null}
function viewStatus(id){const st=statusOf(id);if(['published','skipped','done'].includes(st))return st;return bundleOf(id)?'bundle':st}
const VIEW_LABEL={...ST_LABEL,bundle:'묶음'};
function groups(){const g=[];sections.forEach(s=>{let x=g[g.length-1];if(!x||x.name!==s.grp){x={name:s.grp,items:[]};g.push(x)}x.items.push(s)});return g}
function renderToc(){
  const html=groups().map(g=>{
    const items=g.items.filter(s=>filter==='all'||viewStatus(s.id)===filter||(filter==='published'&&['published','done'].includes(statusOf(s.id))));if(!items.length)return '';
    const done=g.items.filter(s=>isDone(s.id)).length;
    const open=openGroups.has(g.name)||g.items.some(s=>range.includes(s.id))||filter!=='all';
    const multi=g.items.length>1;
    return `<details class="grp" ${open?'open':''} data-g="${esc(g.name)}"><summary>${esc(g.name)}<span class="sumr">${multi?`<button type="button" class="grpOpen" data-g="${esc(g.name)}">묶어 열기</button>`:''}${done}/${g.items.length}</span></summary>`+
      items.map((s,i)=>{
        const vs=viewStatus(s.id),b=bundleOf(s.id),on=range.includes(s.id);
        const prevB=b&&i>0&&bundleOf(items[i-1].id)===b,nextB=b&&i<items.length-1&&bundleOf(items[i+1].id)===b;
        const bcls=b?(' inb'+(prevB?'':' inb-first')+(nextB?'':' inb-last')+(isDone(s.id)?' inb-done':'')):'';
        const stTxt=b&&['published','done','skipped'].includes(statusOf(s.id))?'묶음 '+ST_LABEL[statusOf(s.id)]:VIEW_LABEL[vs];
        return `<div class="item${on?' cur':''}${bcls}"><input type="checkbox" class="ck" data-ck="${s.id}" ${on?'checked':''} aria-label="${esc(s.title)} 선택"><button type="button" class="open" data-id="${s.id}"><span class="no">${s.id.slice(1)}</span><span class="tt">${esc(s.title)}</span></button><span class="st ${vs}">${stTxt}</span></div>`}).join('')+'</details>';
  }).join('');
  $('#toc').innerHTML=html||'<p class="note">이 상태의 원고가 없습니다.</p>';
  renderSelbar();
}
function renderSelbar(){
  const bar=$('#selbar');if(!bar)return;
  bar.hidden=!range.length;if(!range.length)return;
  const lead=range[0],saved=progress[lead]&&progress[lead].members&&progress[lead].members.length>1;
  $('#selN').textContent=range.length===1?'1개 선택':`${range.length}개 선택 · 한 글로 묶음`;
  $('#selUnbundle').hidden=!saved;
  const st=statusOf(lead);
  $('#selDone').textContent=st==='done'?'완료 취소':'완료';
  $('#selPass').textContent=st==='skipped'?'패스 취소':'패스';
}
$('#toc').addEventListener('click',e=>{
  const gb=e.target.closest('.grpOpen');
  if(gb){e.preventDefault();e.stopPropagation();openGroup(gb.dataset.g);return}
  const ck=e.target.closest('.ck');
  if(ck){toggleCheck(ck.dataset.ck,ck.checked,ck);return}
  const b=e.target.closest('.open');if(b)go(leadOf(b.dataset.id));
});
$('#toc').addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.g){d.open?openGroups.add(d.dataset.g):openGroups.delete(d.dataset.g)}},true);
document.querySelectorAll('.chipf').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.f;document.querySelectorAll('.chipf').forEach(x=>x.setAttribute('aria-pressed',x===b));renderToc()}));
function renderMeter(){
  const n=sections.length||1,done=sections.filter(s=>isDone(s.id)).length,dr=sections.filter(s=>statusOf(s.id)==='reviewed').length;
  $('#bDone').style.width=(done/n*100)+'%';$('#bDraft').style.width=(dr/n*100)+'%';
  $('#meterTxt').textContent=`${done} / ${sections.length} 완료`+(dr?` · 검수본 ${dr}`:'');
}
function nextTodo(from){const start=from&&byId[from]?byId[from].idx+1:0;for(let i=0;i<sections.length;i++){const s=sections[(start+i)%sections.length];if(!isDone(s.id))return leadOf(s.id)}return null}
$('#nextBtn').onclick=()=>{const id=nextTodo(null);id?go(id):toast('모든 원고를 마쳤습니다')};

// 다른 글에 이미 쓰인 절인지 (지금 묶음에 넣으면 안 되는 절)
function takenElsewhere(id,lead){
  const p=progress[id];if(!p)return false;
  const mine=x=>x===lead||range.includes(x);
  if(p.lead&&!mine(p.lead))return true;
  if(p.members&&p.members.length>1&&!mine(id))return true;
  if(!p.lead&&!mine(id)&&['published','done'].includes(p.status))return true;
  return false;
}
const snapshotIfOpen=()=>$('#revText')?{draft:$('#revText').value,meta:readMeta(),dirty,titleTouched}:null;
function toggleCheck(id,on,el){
  let ids=range.slice();
  if(on){
    if(takenElsewhere(id,ids[0]||id)){if(el)el.checked=false;toast(`${id.slice(1)}번은 이미 다른 글로 등록·묶음되어 있습니다`);return}
    if(!ids.includes(id))ids.push(id);
  }else ids=ids.filter(x=>x!==id);
  ids.sort(byOrd);
  if(!ids.length){clearSel();return}
  const k=snapshotIfOpen();
  if(k&&!on&&k.draft.trim()){const r=trimSection(k.draft,byId[id].title);k.draft=r.text;if(r.cut)toast('검수본에서 그 절 부분도 뺐습니다')}
  go(ids[0],true,ids,k,true);
}
function clearSel(){range=[];curId=null;document.body.className='view-list';renderToc();showWelcome();try{history.replaceState(null,'',location.pathname)}catch(_){}}
// PART 묶어 열기: 아직 안 한 절만, 다른 글에 쓰인 절 앞까지
function openGroup(name){
  const items=sections.filter(s=>s.grp===name);
  const start=items.findIndex(s=>!isDone(s.id)&&!(progress[s.id]&&progress[s.id].lead));
  if(start<0){toast('이 PART는 모두 마쳤습니다');return}
  const first=items[start].id;const ids=[first];
  for(let i=start+1;i<items.length&&!takenElsewhere(items[i].id,first)&&!isDone(items[i].id);i++)ids.push(items[i].id);
  range=[];go(first,true,ids);
}
// 검수본에서 '## 절 제목' 단락을 찾아 잘라낸다 (편집창으로 가져온 원문 구조일 때)
function trimDraftAt(text,title){const i=text.indexOf('## '+title);if(i<0)return{text,cut:false};return{text:text.slice(0,i).replace(/\s+$/,''),cut:true}}
function trimSection(text,title){
  const i=text.indexOf('## '+title);if(i<0)return{text,cut:false};
  const j=text.indexOf('\n## ',i+3);
  return{text:(text.slice(0,i)+(j<0?'':text.slice(j+1))).replace(/\n{3,}/g,'\n\n').trim(),cut:true};
}

/* ---------- 선택 막대 ---------- */
async function setGroupStatus(st){
  if(!range.length)return;const lead=range[0];
  const cur=statusOf(lead);const to=cur===st?'todo':st;
  try{await api('/status/'+lead,{method:'POST',body:JSON.stringify({status:to,members:range})});await refresh();
    toast(to==='todo'?'되돌렸습니다':(to==='done'?`${range.length}개 절을 완료로 표시했습니다`:`${range.length}개 절을 패스했습니다`));
    if(to==='todo'){go(lead,true,range.slice());return}
    const last=range[range.length-1];const n=nextTodo(last);range=[];n?go(n):clearSel();
  }catch(e){toast(e.message)}
}
$('#selView').onclick=()=>{if(range.length){document.body.className='view-detail';const o=$('#orig');if(o){o.classList.remove('collapse');const b=$('#expandOrig');if(b)b.textContent='접기'}window.scrollTo({top:0})}};
$('#selDone').onclick=()=>setGroupStatus('done');
$('#selPass').onclick=()=>setGroupStatus('skipped');
$('#selClear').onclick=clearSel;
$('#selUnbundle').onclick=async()=>{const lead=range[0];try{await api('/status/'+lead,{method:'POST',body:JSON.stringify({status:'todo'})});await refresh();toast('묶음을 풀었습니다');range=[];go(lead,true,[lead])}catch(e){toast(e.message)}};

/* ---------- 일지 정보 ---------- */
function stripNo(t){return t.replace(/^(\d+)절\.\s*/,'$1절 ')}
function defaultTitle(list){
  const s=list[0],g=/^(PART|부록)/.test(s.grp)?s.grp+' · ':'';
  if(list.length===1)return `『${BOOK}』 ${g}${stripNo(s.title)}`;
  if(/들어가며$/.test(s.title)){const sub=(s.text||'').split('\n\n')[0].trim();if(sub&&sub.length<60)return `『${BOOK}』 ${g}${sub}`}
  return `『${BOOK}』 ${g}${stripNo(s.title)} 외 ${list.length-1}편`;
}
function guessClub(t){if(/웨지/.test(t))return 'wedge';if(/퍼터/.test(t))return 'putter';if(/드라이버/.test(t))return 'driver';if(/아이언/.test(t))return 'iron';return ''}
function firstSentence(text){const p=text.split(/\n\n/).map(x=>x.trim()).find(x=>x&&!x.startsWith('|')&&!x.startsWith('>')&&!x.startsWith('#')&&x!=='[그림]'&&x.length>25)||'';const m=p.match(/^.+?[다요]\./);let d=(m?m[0]:p).trim();if(d.length>110)d=d.slice(0,108)+'…';return d}
function readMeta(){return{title:$('#mTitle').value.trim(),description:$('#mDesc').value.trim()||firstSentence($('#revText').value.replace(/!\[[^\]]*\]\([^)]*\)/g,'')),pubDate:$('#mDate').value||today(),category:$('#mCat').value,clubType:$('#mClub').value,tags:$('#mTags').value.split(',').map(x=>x.trim()).filter(Boolean),cover:curCover,slug:$('#mSlug')?$('#mSlug').value.trim():''}}
function fillMeta(m){curCover=m.cover||'';if(mode==='serial')m={...m,category:'series'};$('#mTitle').value=m.title||'';$('#mDesc').value=m.description||'';$('#mDate').value=m.pubDate||today();$('#mCat').value=m.category||'log';$('#mClub').value=m.clubType||'';$('#mTags').value=(m.tags||[]).join(', ')}
const secBlock=s=>'## '+s.title+'\n\n'+s.text;
function joinText(list){return list.length===1?list[0].text:list.map(secBlock).join('\n\n')}

/* ---------- 작업대 ---------- */
// sel: 절 id 배열(체크한 절들) 또는 끝 절 id. keep: 편집 중인 검수본·일지 정보. stay: 폰에서 목차 화면 유지
async function go(id,push=true,sel=null,keep=null,stay=false){
  id=leadOf(id);const s=byId[id];if(!s)return;
  if(!sel){const m=progress[id]&&progress[id].members;if(m&&m.length>1)sel=m.slice()}
  curId=id;
  if(!stay)document.body.className='view-detail';
  if(!keep)$('#desk').innerHTML='<p class="note">원고를 불러오는 중…</p>';
  let q='';
  if(Array.isArray(sel)&&sel.length>1)q='?ids='+sel.join(',');
  else if(typeof sel==='string'&&sel!==id)q='?to='+sel;
  let d;try{d=await api('/section/'+id+q)}catch(e){$('#desk').innerHTML=`<p class="err">${esc(e.message)}</p>`;return}
  if(curId!==id)return;
  const list=d.sections;range=list.map(x=>x.id);
  const last=list[list.length-1];
  if(push){const h='#'+range.join(',');try{history.replaceState(null,'',h)}catch(_){location.hash=h.slice(1)}}
  renderToc();
  const st=statusOf(id);const p=d.progress;const lastIdx=byId[last.id].idx;
  const bundled=list.length>1;
  const nextSec=sections[lastIdx+1];
  const canAdd=nextSec&&!takenElsewhere(nextSec.id,id);
  const allText=joinText(list);
  const contiguous=list.every((x,i)=>!i||byId[x.id].idx===byId[list[i-1].id].idx+1);
  $('#desk').innerHTML=`
    <div class="deskhead" id="deskhead">
    <div>
      <div class="crumb"><button class="btn back" type="button" id="backBtn">목차</button><span>${esc(s.grp)} · ${bundled?(contiguous?`${s.idx+1}~${lastIdx+1}`:`${list.length}개 절`):s.idx+1}/${sections.length}번째</span><span class="st ${viewStatus(id)}" id="curSt">${VIEW_LABEL[viewStatus(id)]}</span></div>
      <h2 class="sec">${esc(s.title)}${bundled?` <span class="bundcount">외 ${list.length-1}개 절 묶음</span>`:''}</h2>
      ${bundled?`<div class="chips" role="group" aria-label="묶인 절 — 누르면 그 절까지만 묶습니다"><span class="chiplab">여기까지만 묶기</span>${list.map((x,i)=>`<button type="button" class="chip" data-cut="${x.id}" ${i===list.length-1?'aria-current="true"':''}>${esc(x.title)}</button>`).join('')}</div>`:''}
    </div>
    <div class="navrow">
      <button class="btn" type="button" id="prevBtn" ${s.idx===0?'disabled':''}>이전</button>
      <button class="btn" type="button" id="nextSecBtn" ${!nextSec?'disabled':''}>다음</button>
      <button class="btn" type="button" id="addBtn" ${canAdd?'':'disabled'} title="${nextSec&&!canAdd?'다음 절은 이미 다른 글로 등록·묶음되어 있습니다':''}">다음 절 붙이기</button>
      <button class="btn" type="button" id="dropBtn" ${bundled?'':'disabled'}>마지막 절 떼기</button>
      <span class="sep" aria-hidden="true"></span>
      <button class="btn" type="button" id="copyOrigTop">원문 복사</button>
      <button class="btn" type="button" id="copyDraftTop">검수본 복사</button>
    </div>
    </div>
    <section class="panel">
      <div class="panel-h"><h3>1 · 원문${bundled?` (${list.length}개 절)`:''}</h3><div class="navrow"><button class="btn" type="button" id="copyOrig">원문 복사</button><button class="btn" type="button" id="toEditor">편집창으로 가져오기</button><button class="btn" type="button" id="expandOrig">${bundled?'접기':'전체 보기'}</button></div></div>
      <div class="orig${bundled?'':' collapse'}" id="orig">${list.map((x,i)=>(bundled?`<div class="ttlrow"><h4 class="ttl">${esc(x.title)}</h4><span class="ttlacts"><button type="button" class="mini" data-copysec="${i}">이 절 복사</button>${i<list.length-1?`<button type="button" class="mini" data-cut="${x.id}">여기까지만 묶기</button>`:''}</span></div>`:'')+(renderText(x.text)||'<p class="note">본문이 없는 제목 항목입니다.</p>')).join('')}</div>
    </section>
    <section class="panel">
      <div class="panel-h"><h3>2 · 검수본</h3><span class="note" id="saveState">${p&&p.updatedAt?'저장됨 '+esc(p.updatedAt.slice(5,16)):''}</span></div>
      <div class="drop"><span class="btn filebtn">파일 선택 (.txt · .md · .docx)<input type="file" id="fileIn" accept=".txt,.md,.docx,text/plain"></span><span class="btn filebtn gold">사진 넣기<input type="file" id="photoIn" accept="image/*" multiple></span><span>또는 아래에 붙여 넣기</span></div>
      <label class="f" for="revText">검수한 본문 <span class="note">## 로 시작하는 줄은 소제목, 표는 | 칸 | 형식이면 사이트에서 그대로 보입니다. 블로그 글을 복사해 붙여 넣으면 표·사진도 함께 들어옵니다</span></label>
      <textarea class="t" id="revText" placeholder="검수한 원고를 붙여 넣거나 '편집창으로 가져오기'로 원문을 불러와 고치세요."></textarea>
      <div class="photos" id="photoBar" hidden></div>
      <div class="navrow" style="margin-top:10px"><button class="btn gold" type="button" id="saveRev">검수본 저장</button><button class="btn" type="button" id="copyDraft">검수본 복사</button></div>
    </section>
    <section class="panel">
      <div class="panel-h"><h3>3 · 작업일지 등록</h3></div>

  $('#toEditor').onclick=()=>{const ta=$('#revText');if(ta.value.trim()&&ta.value!==allText&&ta.dataset.confirm!=='1'){ta.dataset.confirm='1';toast('편집창에 글이 있습니다. 한 번 더 누르면 원문으로 바꿉니다');return}ta.value=allText;ta.dataset.confirm='';markDirty();ta.focus()};
  $('#revText').addEventListener('input',markDirty);
  $('#mTitle').addEventListener('input',()=>{titleTouched=true});
  $('#fileIn').onchange=async e=>{
    const f=e.target.files[0];e.target.value='';if(!f)return;
    try{let txt;if(/\.docx$/i.test(f.name)){const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});txt=r.value.replace(/\n{3,}/g,'\n\n')}else txt=await f.text();
      $('#revText').value=txt.trim();markDirty();toast(f.name+' 불러옴')}catch(err){toast('파일을 읽지 못했습니다. txt로 저장해 다시 올려 주세요')}
  };
  $('#saveRev').onclick=()=>saveDraft(s);

/* ---------- 사진 ---------- */
// 브라우저에서 긴 변 1600px JPEG로 줄여 올리고, 본문에는 ![설명](photo:ID)로 넣는다.
// 등록할 때 서버가 실제 사진 파일과 주소로 바꿔 함께 올린다.
let curCover='',photoOwner='',photoCache={};
async function shrinkImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();img.src=url;await img.decode();
    const max=1600,r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const w=Math.round(img.naturalWidth*r),h=Math.round(img.naturalHeight*r);
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
    const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',0.85));
    const b64=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.readAsDataURL(blob)});
    return{b64,blob};
  }finally{URL.revokeObjectURL(url)}
}
async function photoUrl(id){
  if(photoCache[id])return photoCache[id];
  const res=await fetch('/api/studio/photo/'+id,{headers:{authorization:'Bearer '+token}});
  if(!res.ok)return '';
  return photoCache[id]=URL.createObjectURL(await res.blob());
}
function insertAtCursor(ta,text){
  const s=ta.selectionStart??ta.value.length,e=ta.selectionEnd??s;
  const before=ta.value.slice(0,s),after=ta.value.slice(e);
  const pre=before&&!before.endsWith('\n\n')?(before.endsWith('\n')?'\n':'\n\n'):'';
  ta.value=before+pre+text+'\n\n'+after.replace(/^\n+/,'');
  const pos=(before+pre+text).length+2;ta.selectionStart=ta.selectionEnd=pos;ta.focus();
  ta.dispatchEvent(new Event('input'));
}
async function renderPhotos(){
  const box=$('#photoBar');if(!box||!photoOwner)return;
  let list=[];try{list=(await api('/api/studio/photo?owner='+encodeURIComponent(photoOwner))).photos}catch(_){}
  if(!$('#photoBar'))return;
  const body=$('#revText')?$('#revText').value:'';
  box.hidden=!list.length;
  box.innerHTML=list.map(p=>`<figure class="ph" data-ph="${p.id}">
      <img alt="" data-src="${p.id}">
      <figcaption>${body.includes('photo:'+p.id)?'<span class="phin">본문에 있음</span>':''}${curCover==='photo:'+p.id?'<span class="phcov">대표</span>':''}</figcaption>
      <div class="phacts"><button type="button" class="mini" data-phins="${p.id}">본문에 넣기</button><button type="button" class="mini" data-phcov="${p.id}">대표 사진</button><button type="button" class="mini" data-phdel="${p.id}">삭제</button></div>
    </figure>`).join('');
  box.querySelectorAll('img[data-src]').forEach(async im=>{im.src=await photoUrl(im.dataset.src)});
}
async function addPhotos(files){
  const ta=$('#revText');if(!ta||!photoOwner)return;
  const list=[...files].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp|heic)$/i.test(f.name));
  if(!list.length){toast('사진 파일을 골라 주세요');return}
  for(let i=0;i<list.length;i++){
    toast(`사진 올리는 중… ${i+1}/${list.length}`);
    try{
      const {b64,blob}=await shrinkImage(list[i]);
      const r=await api('/api/studio/photo',{method:'POST',body:JSON.stringify({owner:photoOwner,mime:'image/jpeg',data:b64,name:list[i].name})});
      photoCache[r.id]=URL.createObjectURL(blob);
      insertAtCursor(ta,`![사진](photo:${r.id})`);
      if(!curCover)curCover='photo:'+r.id;
    }catch(e){toast((list[i].name||'사진')+': '+(e.message||'올리지 못했습니다'));}
  }
  toast(`사진 ${list.length}장을 본문에 넣었습니다. '사진'이라고 된 설명은 고쳐 쓰셔도 됩니다`);
  renderPhotos();
}
// 붙여넣은/가져온 블로그 글: 표·소제목·굵게는 마크다운으로, 사진은 받아서 작업대 사진으로 바꿔 넣는다
let importing=false;
async function importRich(html,{replace=false}={}){
  if(!window.Html2Md){toast('변환 도구를 불러오는 중입니다. 잠시 뒤 다시 해 주세요');return}
  const ta=$('#revText');if(!ta||!photoOwner)return;
  const r=Html2Md.fromHtml(html);
  if(!r.md){toast('가져올 내용이 없습니다');return}
  if(r.title&&$('#mTitle')&&!$('#mTitle').value.trim()){$('#mTitle').value=r.title;$('#mTitle').dispatchEvent(new Event('input'))}
  if(replace||!ta.value.trim()){ta.value=r.md;ta.dispatchEvent(new Event('input'))}else insertAtCursor(ta,r.md);
  if(!r.images.length){toast('글을 가져왔습니다 (표·소제목 포함)');return}
  importing=true;let ok=0;
  for(let i=0;i<r.images.length;i++){
    toast(`사진 가져오는 중… ${i+1}/${r.images.length}`);
    let rep2='> 사진을 가져오지 못했습니다';
    try{
      const res=await fetch('/api/studio/fetch-image?url='+encodeURIComponent(r.images[i]),{headers:{authorization:'Bearer '+token}});
      if(!res.ok)throw new Error((await res.json().catch(()=>({}))).message||res.status);
      const {b64,blob}=await shrinkImage(await res.blob());
      const up=await api('/api/studio/photo',{method:'POST',body:JSON.stringify({owner:photoOwner,mime:'image/jpeg',data:b64,name:'blog-'+(i+1)+'.jpg'})});
      photoCache[up.id]=URL.createObjectURL(blob);
      rep2=`![사진](photo:${up.id})`;ok++;
      if(!curCover)curCover='photo:'+up.id;
    }catch(e){}
    const cur=$('#revText');if(!cur)break;
    cur.value=cur.value.split(`[[img:${i}]]`).join(rep2);
  }
  importing=false;
  const cur=$('#revText');if(cur)cur.dispatchEvent(new Event('input'));
  toast(ok===r.images.length?`글과 사진 ${ok}장을 가져왔습니다`:`사진 ${r.images.length}장 중 ${ok}장을 가져왔습니다. 못 가져온 자리는 표시해 두었습니다`);
  renderPhotos();
}
function bindPhotos(owner){
  photoOwner=owner;
  const inp=$('#photoIn');if(inp)inp.onchange=e=>{const f=e.target.files;if(f&&f.length)addPhotos(f);e.target.value=''};
  const box=$('#photoBar');
  if(box)box.onclick=async e=>{
    const t=e.target;
    if(t.dataset.phins){insertAtCursor($('#revText'),`![사진](photo:${t.dataset.phins})`);renderPhotos()}
    else if(t.dataset.phcov){curCover='photo:'+t.dataset.phcov;markDirty();toast('대표 사진으로 정했습니다 (일지 목록·글 맨 위에 보입니다)');renderPhotos()}
    else if(t.dataset.phdel){
      if(t.dataset.confirm!=='1'){t.dataset.confirm='1';t.textContent='한 번 더 누르면 삭제';return}
      try{await api('/api/studio/photo/'+t.dataset.phdel,{method:'DELETE'});const ta=$('#revText');ta.value=ta.value.replace(new RegExp('!\\[[^\\]]*\\]\\(photo:'+t.dataset.phdel+'\\)\\n*','g'),'');if(curCover==='photo:'+t.dataset.phdel)curCover='';markDirty();renderPhotos();toast('사진을 지웠습니다')}catch(err){toast(err.message)}
    }
  };
  const ta=$('#revText');
  if(ta){
    ta.addEventListener('paste',e=>{
      const cd=e.clipboardData;if(!cd)return;
      const f=[...(cd.files||[])];
      const html=cd.getData('text/html');
      // 블로그·웹 글을 복사해 온 경우: 표·사진·소제목을 살려서 넣는다
      if(html&&/<table|<img|<h[1-6]|se-component|<strong|<b[ >]/i.test(html)){e.preventDefault();if(importing){toast('사진을 가져오는 중입니다. 끝난 뒤 붙여 넣어 주세요');return}importRich(html);return}
      if(f.length){e.preventDefault();addPhotos(f)}
    });
    ta.addEventListener('drop',e=>{const f=[...(e.dataTransfer&&e.dataTransfer.files||[])].filter(x=>/^image\//.test(x.type));if(f.length){e.preventDefault();addPhotos(f)}});
  }
  renderPhotos();
}

    <div class="navrow" style="margin-top:12px"><button class="btn primary" type="button" id="newPost2">새 일지 쓰기</button></div>
    <p class="note" style="margin-top:14px">쓰는 동안 자동으로 저장됩니다. 사진은 긴 변 1600px로 줄여 올리니 휴대폰 사진을 그대로 고르셔도 됩니다.</p></section>`;
  $('#newPost2').onclick=()=>$('#newPost').click();
}
async function openPost(id){
  let d;try{d=(await api('/api/studio/post/'+id)).post}catch(e){toast(e.message);return}
  curPost=d;document.body.className='view-detail';renderPostList();
  try{history.replaceState(null,'','#post-'+id)}catch(_){}
  const pub=d.status==='published';
  $('#postDesk').innerHTML=`
    <div class="deskhead">
      <div class="crumb"><button class="btn back" type="button" id="pBack">글 목록</button><span>작업일지</span><span class="st ${pub?'published':'reviewed'}">${pub?'등록 완료':'쓰는 중'}</span><span class="note" id="saveState">${d.updatedAt?'저장됨 '+esc(d.updatedAt.slice(5,16)):''}</span></div>
      <div class="navrow"><button class="btn" type="button" id="pSave">저장</button><button class="btn" type="button" id="copyDraftTop">본문 복사</button>${pub?'':'<button class="btn" type="button" id="pDel">이 글 지우기</button>'}</div>
    </div>
    <section class="panel">
      <div class="grid2">
        <label class="f" for="mTitle" style="grid-column:1/-1">제목<input class="t" id="mTitle" placeholder="예: 60대 골퍼 — 드라이버 슬라이스, 라이각부터 본 이유"></label>
      </div>
      <div class="catpick" role="radiogroup" aria-label="분류">
        <span class="catlab">분류</span>
        <label><input type="radio" name="pcat" value="log">🔧 작업 일지</label>
        <label><input type="radio" name="pcat" value="review">📐 샤프트·헤드 리뷰</label>
        <label><input type="radio" name="pcat" value="trends">📊 장비 트렌드</label>
        <label><input type="radio" name="pcat" value="data">📏 측정 데이터</label>
        <input type="hidden" id="mCat" value="log">
      </div>
      <div class="drop" style="margin-top:14px"><span class="btn filebtn gold">사진 넣기<input type="file" id="photoIn" accept="image/*" multiple></span><button class="btn" type="button" id="naverBtn">네이버 블로그 글 가져오기</button><span class="btn filebtn">글 파일 불러오기 (.txt · .md · .docx)<input type="file" id="fileIn" accept=".txt,.md,.docx,text/plain"></span></div>
      <div class="naverrow" id="naverRow" hidden>
        <input class="t" id="naverUrl" type="url" inputmode="url" placeholder="https://blog.naver.com/아이디/글번호">
        <button class="btn primary" type="button" id="naverGo">가져오기</button>
        <p class="note">블로그 글 주소를 넣으면 제목·본문·표·사진을 한 번에 가져옵니다. 비공개 글은 블로그에서 전체 복사해 본문 칸에 붙여 넣으세요. 붙여 넣어도 표와 사진이 함께 들어옵니다.</p>
      </div>
      <label class="f" for="revText">본문 <span class="note">## 소제목, **굵게**, | 표 | 를 쓸 수 있습니다. 네이버 블로그 글을 복사해 붙여 넣으면 표·사진까지 그대로 들어옵니다</span></label>
      <textarea class="t" id="revText" placeholder="그날의 작업·측정·진단을 적어 주세요."></textarea>
      <div class="photos" id="photoBar" hidden></div>
    </section>
    <section class="panel">
      <div class="panel-h"><h3>일지 정보</h3></div>
      <div class="grid2">
        <label class="f" for="mDate">작성일<input class="t" id="mDate" type="date"></label>
        <label class="f" for="mDesc" style="grid-column:1/-1">한 줄 요약 (비우면 본문 첫 문장)<input class="t" id="mDesc"></label>
        <label class="f" for="mClub">클럽 종류<select class="t" id="mClub"><option value="">선택 안 함</option><option value="driver">드라이버</option><option value="fairway">페어웨이 우드</option><option value="hybrid">하이브리드</option><option value="iron">아이언</option><option value="wedge">웨지</option><option value="putter">퍼터</option><option value="mixed">복합/세트</option></select></label>
        <label class="f" for="mSlug">주소 (영문, 선택)<input class="t" id="mSlug" placeholder="예: driver-lie-angle" ${d.file?'disabled':''}></label>
        <label class="f" for="mTags" style="grid-column:1/-1">태그 (쉼표로 구분)<input class="t" id="mTags" placeholder="예: 라이각, 슬라이스, 드라이버"></label>
      </div>
      <div class="navrow" style="margin-top:16px;align-items:center">
        <button class="btn primary" type="button" id="pubBtn">${pub?'수정본 다시 등록':'작업일지에 등록'}</button>
        <span class="note" id="pubMsg">${pub&&d.file?`등록됨 · <a href="/journal/${esc(d.file.replace(/\.md$/,''))}/" target="_blank" rel="noopener">일지에서 보기</a>`:'누르면 사진과 함께 바로 사이트에 올라갑니다 (반영까지 1~2분).'}</span>
      </div>
    </section>`;
  fillMeta(d.meta||{});$('#mSlug').value=(d.meta&&d.meta.slug)||'';
  {const c=['log','review','trends','data'].includes($('#mCat').value)?$('#mCat').value:'log';$('#mCat').value=c;
   document.querySelectorAll('input[name=pcat]').forEach(r=>{r.checked=r.value===c;r.onchange=()=>{$('#mCat').value=r.value;$('#mCat').dispatchEvent(new Event('input'))}})}$('#revText').value=d.draft||'';
  dirty=false;
  const save=async quiet=>{
    if(!curPost||curPost.id!==id)return;
    try{const r=await api('/api/studio/post/'+id,{method:'PUT',body:JSON.stringify({draft:$('#revText').value,meta:readMeta()})});dirty=false;$('#saveState').textContent='저장됨 '+r.updatedAt.slice(5,16);if(!quiet)toast('저장했습니다');const p=posts.find(x=>x.id===id);if(p){p.title=$('#mTitle').value;p.updatedAt=r.updatedAt;renderPostList()}}catch(e){if(!quiet)toast(e.message)}
  };
  const later=()=>{markDirty();clearTimeout(autoT);autoT=setTimeout(()=>save(true),2500)};
  $('#revText').addEventListener('input',later);
  ['mTitle','mDesc','mDate','mCat','mClub','mTags','mSlug'].forEach(x=>$('#'+x).addEventListener('input',later));
  $('#pSave').onclick=()=>save(false);
  $('#pBack').onclick=()=>{document.body.className='view-list';window.scrollTo({top:0})};
  $('#copyDraftTop').onclick=()=>{const v=$('#revText').value;v.trim()?copy(v,'본문을 복사했습니다'):toast('본문이 비어 있습니다')};
  const del=$('#pDel');if(del)del.onclick=async()=>{if(del.dataset.confirm!=='1'){del.dataset.confirm='1';del.textContent='한 번 더 누르면 지웁니다';return}try{await api('/api/studio/post/'+id,{method:'DELETE'});curPost=null;toast('지웠습니다');await loadPosts();showPostWelcome()}catch(e){toast(e.message)}};
  $('#fileIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{let txt;if(/\.docx$/i.test(f.name)){const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});txt=r.value.replace(/\n{3,}/g,'\n\n')}else txt=await f.text();insertAtCursor($('#revText'),txt.trim());toast(f.name+' 불러옴')}catch(err){toast('파일을 읽지 못했습니다')}};
  $('#pubBtn').onclick=async()=>{
    const draft=$('#revText').value.trim();if(draft.length<10){toast('본문을 먼저 써 주세요');return}
    if(!$('#mTitle').value.trim()){toast('제목을 써 주세요');$('#mTitle').focus();return}
    clearTimeout(autoT);
    const btn=$('#pubBtn'),msg=$('#pubMsg');btn.classList.add('busy');msg.className='note';msg.textContent='사진과 함께 올리는 중…';
    try{const r=await api('/api/studio/post/'+id+'/publish',{method:'POST',body:JSON.stringify({draft,meta:readMeta()})});dirty=false;
      msg.className='okmsg';msg.innerHTML=`${r.updated?'수정본을 다시 올렸습니다':'작업일지에 올렸습니다'}. 1~2분 뒤 <a href="${esc(r.journalUrl)}" target="_blank" rel="noopener">일지에서 보기</a>`;
      btn.textContent='수정본 다시 등록';toast('등록했습니다');await loadPosts();$('#mSlug').disabled=true}
    catch(e){msg.className='err';msg.textContent=e.message}finally{btn.classList.remove('busy')}
  };
  $('#naverBtn').onclick=()=>{const r=$('#naverRow');r.hidden=!r.hidden;if(!r.hidden)$('#naverUrl').focus()};
  $('#naverUrl').addEventListener('keydown',e=>{if(e.key==='Enter')$('#naverGo').click()});
  $('#naverGo').onclick=async()=>{
    const u=$('#naverUrl').value.trim();if(!u){toast('블로그 글 주소를 넣어 주세요');return}
    const b=$('#naverGo');b.classList.add('busy');b.textContent='가져오는 중…';
    try{const r=await api('/api/studio/naver?url='+encodeURIComponent(u));
      const ta=$('#revText');const replace=!ta.value.trim();
      await importRich(r.html,{replace});
      if(!replace)toast('지금 본문 커서 위치에 이어 붙였습니다');
      $('#naverRow').hidden=true;$('#naverUrl').value='';
    }catch(e){toast(e.message)}
    finally{b.classList.remove('busy');b.textContent='가져오기'}
  };
  bindPhotos(id);window.scrollTo({top:0});
}

function setTopH(){const h=document.querySelector('header.top');if(h)document.documentElement.style.setProperty('--toph',h.offsetHeight+'px')}
window.addEventListener('resize',setTopH);setTopH();
function routePosts(){const h=location.hash.slice(1);if(h==='posts'||h.startsWith('post-')){setMode('posts');if(h.startsWith('post-'))openPost(h.slice(5));return true}return false}
token=load('studioToken')||'';
if(token)login(token);else show('loginView');
</script>
</body>
</html>
